<body class="min-h-screen font-sans text-gray-900 antialiased">
    <div class="h-1 bg-spectrum"></div>

    <header class="sticky top-0 z-30 border-b border-gray-200 bg-surface/85 backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-control bg-graphite-gradient font-display text-sm font-bold tracking-wide text-white">AF</span>
            <div class="min-w-0">
                <h1 class="font-display text-lg font-semibold leading-tight">حزمة التدقيق</h1>
                <p class="text-sm text-gray-400">فرع رام الله · الأسبوع 41</p>
            </div>
            <span class="ms-auto hidden rounded-full border border-gray-200 px-3 py-1 text-sm text-gray-500 sm:inline-flex">6 – 12 أكتوبر 2026</span>
            <button id="theme" type="button" class="ms-auto grid h-10 w-10 place-items-center rounded-control border border-gray-200 text-gray-500 transition hover:bg-gray-100 sm:ms-0" aria-label="تبديل المظهر"></button>
        </div>
    </header>

    <main class="mx-auto grid max-w-6xl gap-6 px-4 pb-32 pt-6 lg:grid-cols-[minmax(0,1fr)_340px] lg:pb-10">
        <section class="min-w-0 space-y-5">
            <ol id="steps" class="flex items-center gap-2"></ol>

            <div id="kpis" class="grid grid-cols-3 gap-3"></div>

            <div id="banner"></div>

            <div class="flex items-center gap-3">
                <label class="relative flex-1">
                    <span class="sr-only">بحث</span>
                    <span id="search-icon" class="pointer-events-none absolute inset-y-0 start-3 grid place-items-center text-gray-400"></span>
                    <input id="search" type="search" placeholder="ابحث عن محصّل" class="w-full rounded-control border-gray-200 bg-surface py-2.5 pe-3 ps-10 text-gray-900 placeholder:text-gray-400 focus:border-brand-400 focus:ring-brand-500/20">
                </label>
                <button id="select-all" type="button" class="shrink-0 rounded-control border border-gray-200 bg-surface px-4 py-2.5 font-medium text-gray-700 transition hover:bg-gray-100 disabled:opacity-50"></button>
            </div>

            <div id="list" class="space-y-3"></div>
        </section>

        <aside class="hidden lg:block">
            <div id="package" class="sticky top-24"></div>
        </aside>
    </main>

    <div id="mobile-bar" class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-graphite-gradient px-4 py-3 text-white lg:hidden"></div>

    <dialog id="dialog" class="w-[min(440px,calc(100vw-32px))] rounded-panel bg-surface p-0 text-gray-900 shadow-lift">
        <div id="dialog-body"></div>
    </dialog>

    <script>
        const icons = {
            package: '<path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
            send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
            check: '<path d="M20 6 9 17l-5-5"/>',
            chevron: '<path d="m6 9 6 6 6-6"/>',
            search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
            moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
            lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
            alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
            archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
            x: '<path d="M18 6 6 18M6 6l12 12"/>',
            undo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
        };
        const icon = (name, size = 'h-5 w-5') => `<svg class="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;

        const types = {
            cash: { label: 'نقدي', dot: 'bg-brand-500', bar: 'bg-brand-400' },
            bank: { label: 'حوالات', dot: 'bg-blue-500', bar: 'bg-blue-500' },
            clearing: { label: 'مقاصات', dot: 'bg-teal', bar: 'bg-teal' },
        };
        const avatarTones = ['bg-brand-100 text-brand-700', 'bg-blue-500/15 text-blue-600', 'bg-teal/15 text-teal', 'bg-warn/15 text-warn', 'bg-gray-200 text-gray-700'];

        const collectors = [
            { id: 1, name: 'أحمد خليل', boxes: [
                { no: 'CB-10418', type: 'cash', count: 48, amount: 12450, status: 'ready' },
                { no: 'CB-10419', type: 'bank', count: 6, amount: 3200, status: 'ready' },
                { no: 'CB-10420', type: 'clearing', count: 2, amount: 850, status: 'ready' },
            ] },
            { id: 2, name: 'محمد سعيد', boxes: [
                { no: 'CB-10425', type: 'cash', count: 37, amount: 9870, status: 'ready' },
                { no: 'CB-10431', type: 'cash', count: 9, amount: 1240, status: 'open' },
            ] },
            { id: 3, name: 'يوسف عودة', boxes: [
                { no: 'CB-10427', type: 'cash', count: 56, amount: 15300, status: 'diff', diff: -120 },
                { no: 'CB-10428', type: 'bank', count: 8, amount: 4750, status: 'ready' },
            ] },
            { id: 4, name: 'خالد منصور', boxes: [
                { no: 'CB-10433', type: 'cash', count: 29, amount: 7620, status: 'ready' },
            ] },
            { id: 5, name: 'سامر حمدان', boxes: [
                { no: 'CB-10435', type: 'cash', count: 41, amount: 11080, status: 'ready' },
                { no: 'CB-10436', type: 'clearing', count: 3, amount: 1400, status: 'ready' },
                { no: 'CB-10440', type: 'cash', count: 4, amount: 650, status: 'open' },
            ] },
            { id: 6, name: 'عمر ناصر', boxes: [
                { no: 'CB-10437', type: 'cash', count: 25, amount: 6940, status: 'ready' },
                { no: 'CB-10438', type: 'bank', count: 5, amount: 2300, status: 'ready' },
            ] },
        ];

        const allBoxes = collectors.flatMap((person) => person.boxes.map((box) => ({ ...box, person })));
        const eligible = (boxes) => boxes.filter((box) => box.status !== 'open');
        const selected = new Set(eligible(allBoxes).map((box) => box.no));
        const expanded = new Set([1]);
        let query = '';
        let sent = null;

        const money = (amount) => `<span class="num" dir="ltr">${amount < 0 ? '−' : ''}${Math.abs(amount).toLocaleString('en-US')} ₪</span>`;
        const sum = (boxes) => boxes.reduce((total, box) => total + box.amount, 0);
        const $ = (id) => document.getElementById(id);

        function pill(box) {
            if (box.status === 'open') {
                return `<span class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-500">${icon('lock', 'h-3.5 w-3.5')}مفتوح</span>`;
            }
            if (box.status === 'diff') {
                return `<span class="inline-flex items-center gap-1 rounded-full bg-warn/10 px-2.5 py-0.5 text-xs font-medium text-warn">فرق ${money(box.diff)}</span>`;
            }
            return '<span class="inline-flex items-center rounded-full bg-ok/10 px-2.5 py-0.5 text-xs font-medium text-ok">جاهز</span>';
        }

        function renderSteps() {
            const current = sent ? 4 : selected.size ? 2 : 1;
            $('steps').innerHTML = ['تجميع', 'مراجعة', 'إرسال'].map((label, index) => {
                const step = index + 1;
                const done = step < current;
                const active = step === current;
                const dot = done ? 'bg-ok text-white' : active ? 'bg-brand-500 text-white shadow-glow' : 'bg-gray-200 text-gray-500';
                return `${index ? `<li aria-hidden="true" class="h-0.5 flex-1 rounded-full ${done || active ? 'bg-ok/60' : 'bg-gray-200'}"></li>` : ''}
                    <li class="flex items-center gap-2" ${active ? 'aria-current="step"' : ''}>
                        <span class="grid h-7 w-7 place-items-center rounded-full text-sm font-semibold ${dot}">${done ? icon('check', 'h-4 w-4') : step}</span>
                        <span class="text-sm font-medium ${active ? 'text-gray-900' : 'text-gray-400'}">${label}</span>
                    </li>`;
            }).join('');
        }

        function renderKpis() {
            const tiles = [
                ['جاهزة', allBoxes.filter((box) => box.status === 'ready').length, 'text-ok', 'bg-ok/10', 'check'],
                ['بفرق', allBoxes.filter((box) => box.status === 'diff').length, 'text-warn', 'bg-warn/10', 'alert'],
                ['مفتوحة', allBoxes.filter((box) => box.status === 'open').length, 'text-gray-500', 'bg-gray-100', 'lock'],
            ];
            $('kpis').innerHTML = tiles.map(([label, value, tone, tint, name]) => `
                <div class="flex items-center gap-3 rounded-card bg-surface p-4 shadow-card">
                    <span class="hidden h-10 w-10 shrink-0 place-items-center rounded-control sm:grid ${tint} ${tone}">${icon(name)}</span>
                    <div><b class="num block font-display text-2xl leading-none">${value}</b><span class="text-sm text-gray-400">${label}</span></div>
                </div>`).join('');
        }

        function renderBanner() {
            $('banner').innerHTML = sent ? `
                <div class="flex items-center gap-3 rounded-row border border-ok/30 bg-ok/10 p-4">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-ok text-white">${icon('check', 'h-4 w-4')}</span>
                    <div class="min-w-0 flex-1"><b class="block">أُرسلت للتدقيق</b><span class="text-sm text-gray-500"><span class="num" dir="ltr">${sent.ref}</span> · ${sent.time}</span></div>
                    <button type="button" data-withdraw class="inline-flex items-center gap-1.5 rounded-control px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-surface">${icon('undo', 'h-4 w-4')}سحب</button>
                </div>` : '';
        }

        function collectorCard(person, index) {
            const usable = eligible(person.boxes);
            const picked = usable.filter((box) => selected.has(box.no));
            const openCount = person.boxes.length - usable.length;
            const hasDiff = picked.some((box) => box.status === 'diff');
            const isOpen = expanded.has(person.id);

            const rows = person.boxes.map((box) => `
                <li class="flex flex-wrap items-center gap-x-3 gap-y-1 px-4 py-3 sm:ps-6 ${box.status === 'open' ? 'opacity-60' : ''}">
                    <input type="checkbox" data-box="${box.no}" ${selected.has(box.no) ? 'checked' : ''} ${box.status === 'open' || sent ? 'disabled' : ''}
                        aria-label="${box.no}" class="h-5 w-5 rounded-md border-gray-300 bg-surface text-brand-500 focus:ring-brand-500/30 disabled:opacity-40">
                    <span class="h-2.5 w-2.5 shrink-0 rounded-full ${types[box.type].dot}" aria-hidden="true"></span>
                    <div class="min-w-0 flex-1">
                        <span class="num font-medium" dir="ltr">${box.no}</span>
                        <span class="block text-sm text-gray-400 sm:inline"><span class="hidden sm:inline"> · </span>${types[box.type].label} · ${box.count} حركة</span>
                    </div>
                    ${pill(box)}
                    <span class="w-24 text-left font-semibold">${money(box.amount)}</span>
                </li>`).join('');

            return `
                <article data-person="${person.id}" class="overflow-hidden rounded-card border bg-surface shadow-card transition ${picked.length ? 'border-brand-200' : 'border-transparent'} ${isOpen ? 'is-open' : ''}">
                    <div class="flex items-center gap-3 p-4">
                        <input type="checkbox" data-collector="${person.id}" ${picked.length === usable.length && usable.length ? 'checked' : ''} ${sent ? 'disabled' : ''}
                            aria-label="تضمين ${person.name}" class="h-5 w-5 rounded-md border-gray-300 bg-surface text-brand-500 focus:ring-brand-500/30 disabled:opacity-40">
                        <button type="button" data-toggle="${person.id}" aria-expanded="${isOpen}" class="flex min-w-0 flex-1 items-center gap-3 text-start">
                            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full font-display font-semibold ${avatarTones[index % avatarTones.length]}">${person.name.slice(0, 1)}</span>
                            <span class="min-w-0 flex-1">
                                <b class="block truncate">${person.name}</b>
                                <span class="text-sm text-gray-400">${picked.length}/${usable.length} صناديق${openCount ? ` · ${openCount} مفتوح` : ''}</span>
                            </span>
                            ${hasDiff ? `<span class="text-warn" title="صندوق بفرق">${icon('alert', 'h-4 w-4')}</span>` : ''}
                            <b class="text-lg">${money(sum(picked))}</b>
                            <span class="chev grid h-8 w-8 shrink-0 place-items-center rounded-full text-gray-400 transition">${icon('chevron', 'h-4 w-4')}</span>
                        </button>
                    </div>
                    <div class="rows"><div><ul class="divide-y divide-gray-100 border-t border-gray-100 bg-gray-50/60">${rows}</ul></div></div>
                </article>`;
        }

        function renderList() {
            const visible = collectors.filter((person) => person.name.includes(query.trim()));
            $('list').innerHTML = visible.length
                ? visible.map((person) => collectorCard(person, collectors.indexOf(person))).join('')
                : `<div class="rounded-card bg-surface p-10 text-center text-gray-400 shadow-card">لا نتائج</div>`;

            visible.forEach((person) => {
                const usable = eligible(person.boxes);
                const picked = usable.filter((box) => selected.has(box.no)).length;
                const box = document.querySelector(`[data-collector="${person.id}"]`);
                box.indeterminate = picked > 0 && picked < usable.length;
            });

            const everything = eligible(allBoxes);
            const allPicked = everything.every((box) => selected.has(box.no));
            $('select-all').textContent = allPicked ? 'إلغاء الكل' : 'تحديد الكل';
            $('select-all').disabled = !!sent;
        }

        function packageTotals() {
            const boxes = allBoxes.filter((box) => selected.has(box.no));
            const people = collectors.filter((person) => person.boxes.some((box) => selected.has(box.no)));
            const byType = Object.keys(types).map((type) => [type, sum(boxes.filter((box) => box.type === type))]);
            return {
                boxes,
                people,
                byType,
                total: sum(boxes),
                diffs: boxes.filter((box) => box.status === 'diff').length,
                openCount: allBoxes.filter((box) => box.status === 'open').length,
            };
        }

        function sendButton(classes = '') {
            if (sent) {
                return `<button type="button" disabled class="inline-flex items-center justify-center gap-2 rounded-control bg-ok/90 px-5 py-3 font-semibold text-white ${classes}">${icon('check')}بانتظار التدقيق</button>`;
            }
            return `<button type="button" data-send ${selected.size ? '' : 'disabled'} class="inline-flex items-center justify-center gap-2 rounded-control bg-brand-500 px-5 py-3 font-semibold text-white shadow-glow transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-white/15 disabled:shadow-none ${classes}">${icon('send')}إرسال للتدقيق</button>`;
        }

        function renderPackage() {
            const { boxes, people, byType, total, diffs, openCount } = packageTotals();
            const avatars = people.slice(0, 5).map((person) => `<span class="grid h-9 w-9 place-items-center rounded-full border-2 border-[#1b2026] bg-white/10 text-sm font-semibold" title="${person.name}">${person.name.slice(0, 1)}</span>`).join('');
            const more = people.length > 5 ? `<span class="grid h-9 w-9 place-items-center rounded-full border-2 border-[#1b2026] bg-white/20 text-xs">+${people.length - 5}</span>` : '';

            $('package').innerHTML = `
                <div class="relative overflow-hidden rounded-panel bg-graphite-gradient p-6 text-white shadow-lift">
                    <div class="pointer-events-none absolute -end-16 -top-16 h-48 w-48 rounded-full bg-brand-500/25 blur-3xl"></div>
                    <div class="relative space-y-6">
                        <div class="flex items-center gap-3">
                            <span class="grid h-11 w-11 place-items-center rounded-control bg-white/10">${icon('package')}</span>
                            <div class="flex-1"><b class="font-display text-lg">الحزمة</b><p class="text-sm text-white/60">${people.length} محصّلين · ${boxes.length} صناديق</p></div>
                        </div>

                        <div>
                            <span class="text-sm text-white/60">الإجمالي</span>
                            <b class="block font-display text-4xl font-semibold">${money(total)}</b>
                        </div>

                        <div class="space-y-3">
                            <div class="flex h-2 overflow-hidden rounded-full bg-white/10">
                                ${byType.map(([type, amount]) => `<span class="${types[type].bar}" style="width:${total ? (amount / total) * 100 : 0}%"></span>`).join('')}
                            </div>
                            ${byType.map(([type, amount]) => `
                                <div class="flex items-center gap-2 text-sm">
                                    <span class="h-2.5 w-2.5 rounded-full ${types[type].dot}"></span>
                                    <span class="flex-1 text-white/70">${types[type].label}</span>
                                    <b>${money(amount)}</b>
                                </div>`).join('')}
                        </div>

                        ${people.length ? `<div class="flex -space-x-2 space-x-reverse">${avatars}${more}</div>` : ''}

                        ${sendButton('w-full')}

                        ${diffs || openCount ? `<div class="space-y-1.5 text-sm">
                            ${diffs ? `<p class="flex items-center gap-2 text-amber-300">${icon('alert', 'h-4 w-4')}${diffs} صندوق بفرق</p>` : ''}
                            ${openCount ? `<p class="flex items-center gap-2 text-white/50">${icon('lock', 'h-4 w-4')}${openCount} مفتوح خارج الحزمة</p>` : ''}
                        </div>` : ''}
                    </div>
                </div>`;

            $('mobile-bar').innerHTML = `
                <div class="mx-auto flex max-w-6xl items-center gap-3">
                    <div class="min-w-0 flex-1">
                        <b class="block font-display text-xl">${money(total)}</b>
                        <span class="text-sm text-white/60">${people.length} محصّلين · ${boxes.length} صناديق</span>
                    </div>
                    ${sendButton()}
                </div>`;
        }

        function render() {
            const focused = document.activeElement;
            const focusKey = focused?.dataset && Object.entries(focused.dataset)[0];
            renderSteps();
            renderKpis();
            renderBanner();
            renderList();
            renderPackage();
            if (focusKey) {
                document.querySelector(`[data-${focusKey[0]}="${focusKey[1]}"]`)?.focus();
            }
        }

        function openDialog() {
            const { boxes, people, total, diffs } = packageTotals();
            $('dialog-body').innerHTML = `
                <form method="dialog" class="space-y-5 p-6">
                    <div class="flex items-start gap-3">
                        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-control bg-brand-50 text-brand-500">${icon('package')}</span>
                        <div class="flex-1"><h2 class="font-display text-lg font-semibold">إرسال الحزمة للتدقيق</h2><p class="text-sm text-gray-400">الأسبوع 41 · فرع رام الله</p></div>
                        <button value="cancel" class="grid h-9 w-9 place-items-center rounded-full text-gray-400 hover:bg-gray-100" aria-label="إغلاق">${icon('x', 'h-4 w-4')}</button>
                    </div>
                    <div class="grid grid-cols-3 divide-x divide-x-reverse divide-gray-200 rounded-row bg-gray-50 py-4 text-center">
                        <div><b class="num block font-display text-xl">${people.length}</b><span class="text-sm text-gray-400">محصّلين</span></div>
                        <div><b class="num block font-display text-xl">${boxes.length}</b><span class="text-sm text-gray-400">صناديق</span></div>
                        <div><b class="block font-display text-xl">${money(total)}</b><span class="text-sm text-gray-400">الإجمالي</span></div>
                    </div>
                    ${diffs ? `<p class="flex items-center gap-2 rounded-control bg-warn/10 px-3 py-2 text-sm text-warn">${icon('alert', 'h-4 w-4')}تتضمّن ${diffs} صندوق بفرق</p>` : ''}
                    <label class="block space-y-2">
                        <span class="text-sm font-medium text-gray-600">ملاحظة <span class="text-gray-400">(اختياري)</span></span>
                        <textarea rows="2" class="w-full resize-none rounded-control border-gray-200 bg-surface text-gray-900 focus:border-brand-400 focus:ring-brand-500/20"></textarea>
                    </label>
                    <div class="flex gap-3">
                        <button type="button" data-confirm class="inline-flex flex-1 items-center justify-center gap-2 rounded-control bg-brand-500 px-5 py-3 font-semibold text-white shadow-glow transition hover:bg-brand-600">${icon('send')}تأكيد الإرسال</button>
                        <button value="cancel" class="rounded-control border border-gray-200 px-5 py-3 font-medium text-gray-600 hover:bg-gray-100">إلغاء</button>
                    </div>
                </form>`;
            $('dialog').showModal();
        }

        function confirmSend(button) {
            button.disabled = true;
            button.innerHTML = '<span class="h-5 w-5 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>جارٍ الإرسال';
            setTimeout(() => {
                const now = new Date();
                sent = { ref: 'PKG-2641-07', time: now.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' }) };
                const { total, boxes } = packageTotals();
                $('dialog-body').innerHTML = `
                    <div class="space-y-5 p-8 text-center">
                        <span class="ring-pulse mx-auto grid h-16 w-16 place-items-center rounded-full bg-ok text-white">
                            <svg class="draw h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                        </span>
                        <div><h2 class="font-display text-xl font-semibold">أُرسلت للتدقيق</h2><p class="mt-1 text-gray-400">${boxes.length} صناديق · ${money(total)}</p></div>
                        <span class="inline-block rounded-full bg-gray-100 px-4 py-1.5 font-medium num" dir="ltr">${sent.ref}</span>
                        <form method="dialog"><button class="w-full rounded-control bg-gray-900 px-5 py-3 font-semibold text-gray-50 hover:opacity-90">تم</button></form>
                    </div>`;
                render();
            }, 900);
        }

        function setTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            $('theme').innerHTML = icon(dark ? 'sun' : 'moon');
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (error) {}
        }

        let storedTheme = null;
        try { storedTheme = localStorage.getItem('theme'); } catch (error) {}
        setTheme(storedTheme ? storedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
        $('search-icon').innerHTML = icon('search', 'h-4 w-4');

        $('theme').addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
        $('search').addEventListener('input', (event) => { query = event.target.value; renderList(); });
        $('select-all').addEventListener('click', () => {
            const everything = eligible(allBoxes);
            const allPicked = everything.every((box) => selected.has(box.no));
            everything.forEach((box) => allPicked ? selected.delete(box.no) : selected.add(box.no));
            render();
        });

        document.addEventListener('change', (event) => {
            const { box, collector } = event.target.dataset;
            if (box) {
                event.target.checked ? selected.add(box) : selected.delete(box);
            }
            if (collector) {
                const person = collectors.find((item) => item.id === Number(collector));
                eligible(person.boxes).forEach((item) => event.target.checked ? selected.add(item.no) : selected.delete(item.no));
            }
            if (box || collector) {
                render();
            }
        });

        document.addEventListener('click', (event) => {
            const toggle = event.target.closest('[data-toggle]');
            if (toggle) {
                const id = Number(toggle.dataset.toggle);
                expanded.has(id) ? expanded.delete(id) : expanded.add(id);
                const card = toggle.closest('article');
                card.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded', expanded.has(id));
            }
            if (event.target.closest('[data-send]')) {
                openDialog();
            }
            if (event.target.closest('[data-confirm]')) {
                confirmSend(event.target.closest('[data-confirm]'));
            }
            if (event.target.closest('[data-withdraw]')) {
                sent = null;
                render();
            }
        });

        render();
    </script>
</body>
</html>
