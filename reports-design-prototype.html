<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>تقارير التحصيل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky filter bar, report catalogue rail + open report; Excel and print studios slide in as two-pane drawers (settings | live preview). */
:root{
  --bg:#eef0f3;--surface:#ffffff;--surface2:#f6f7f9;--ink:#111820;--ink2:#353c46;--muted:#5b6470;--line:#dfe2e6;--line2:#cdd3da;
  --brand:#a51d26;--brand-ink:#a51d26;--brand-soft:#fbf1f1;--graphite:#1b2026;--on-strong:#ffffff;
  --ok:#047857;--ok-soft:#e6f4ee;--warn:#9a4a0a;--warn-soft:#fdf3e6;--bad:#c81e1e;--bad-soft:#fdeded;
  --xl:#107c41;--xl-ink:#0e6e3a;--xl-soft:#e7f3ec;
  --a1:#efd3d5;--a2:#de9aa0;--a3:#c4515a;--a4:#a51d26;--a5:#6b1118;
  --shadow:0 1px 2px rgb(16 24 40/.05),0 12px 30px -18px rgb(16 24 40/.28);--scrim:rgb(17 21 25/.45);
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  --f-num:Alexandria,'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10;--surface:#14171c;--surface2:#1a1e24;--ink:#f1f3f5;--ink2:#cdd2d9;--muted:#9aa3ae;--line:#252a32;--line2:#353b45;
  --brand:#b8232c;--brand-ink:#f0838a;--brand-soft:#2a1215;--graphite:#2a3039;
  --ok:#34d399;--ok-soft:#0e2a1f;--warn:#fbbf24;--warn-soft:#2b2210;--bad:#fc8181;--bad-soft:#2e1515;
  --xl:#16804a;--xl-ink:#5ccf8c;--xl-soft:#0f2619;
  --a1:#3d2023;--a2:#6e2a31;--a3:#a8353e;--a4:#dd5e67;--a5:#f6a9af;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 16px 36px -18px rgb(0 0 0/.8);--scrim:rgb(0 0 0/.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10;--surface:#14171c;--surface2:#1a1e24;--ink:#f1f3f5;--ink2:#cdd2d9;--muted:#9aa3ae;--line:#252a32;--line2:#353b45;
  --brand:#b8232c;--brand-ink:#f0838a;--brand-soft:#2a1215;--graphite:#2a3039;
  --ok:#34d399;--ok-soft:#0e2a1f;--warn:#fbbf24;--warn-soft:#2b2210;--bad:#fc8181;--bad-soft:#2e1515;
  --xl:#16804a;--xl-ink:#5ccf8c;--xl-soft:#0f2619;
  --a1:#3d2023;--a2:#6e2a31;--a3:#a8353e;--a4:#dd5e67;--a5:#f6a9af;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 16px 36px -18px rgb(0 0 0/.8);--scrim:rgb(0 0 0/.6);color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.boot{padding:60px 20px;text-align:center;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark img{height:34px;width:auto}
.brandmark b{display:block;font-size:17px;font-weight:700}
.brandmark small{display:block;font-size:12px;color:var(--muted)}
.top .grow{flex:1}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;height:38px;padding-inline:10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.field select,.field input{border:0;background:transparent;font-weight:600;outline:none;min-width:0}
.field input[type=date]{width:128px;font-family:var(--f-num);font-size:13px}
.field small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:30px;padding-inline:12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--graphite);color:var(--on-strong)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding-inline:9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.sample{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding-inline:14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.xl{background:var(--xl);border-color:var(--xl);color:var(--on-strong)}
.btn.xl:hover{filter:brightness(1.08)}
.btn.xl-soft{background:var(--xl-soft);border-color:transparent;color:var(--xl-ink)}
.btn.pr{background:var(--graphite);border-color:var(--graphite);color:var(--on-strong)}
.btn.pr:hover{filter:brightness(1.15)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding-inline:10px;font-size:13px;border-radius:8px}
.btn.icon{width:32px;padding:0}

/* page */
.wrap{max-width:1560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
.rail h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding-inline:10px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.ri{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:transparent;padding:9px 10px;border-radius:11px;color:var(--ink2)}
.ri:hover{background:var(--surface)}
.ri[aria-current=page]{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.ri[aria-current=page] .ri-ic{background:var(--brand);color:var(--on-strong)}
.ri-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface2);color:var(--ink2);flex-shrink:0}
.ri b{display:block;font-size:14px;font-weight:600}
.ri small{display:block;font-size:12px;color:var(--muted)}
.rail-note{font-size:12.5px;line-height:1.7;color:var(--muted);padding:12px;border:1px dashed var(--line2);border-radius:12px}
.rail-note kbd{font-family:var(--f-num);font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-radius:5px;background:var(--surface)}

.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
.rhead .t{flex:1;min-width:240px}
.rhead h1{font-size:24px;font-weight:700;font-family:var(--f-num);letter-spacing:-.01em}
.rhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.rhead .acts{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h3{font-size:15px;font-weight:700}
.card-h small{color:var(--muted);font-size:12.5px}
.card-b{padding:12px 16px 16px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:1500px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi small{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-num);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi b i{font-style:normal;font-size:14px;color:var(--muted);margin-inline-start:4px}
.kpi span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.split{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:2px;margin-top:4px}
.split i{display:block;height:100%;border-radius:3px}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--graphite);color:var(--on-strong);border-radius:9px;padding:7px 10px;font-size:12.5px;white-space:nowrap;transform:translate(50%,-100%);box-shadow:var(--shadow)}
.tip b{font-family:var(--f-num);display:block;font-size:14px}
.meter{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.meter:last-child{border-bottom:0}
.meter .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.meter .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.meter .v small{display:block;color:var(--muted);font-size:11.5px}
.stack{display:flex;height:22px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend s{width:12px;height:12px;border-radius:3px;flex-shrink:0;text-decoration:none}
.legend b{font-family:var(--f-num);font-weight:600;margin-inline-start:auto;font-variant-numeric:tabular-nums}

/* tables */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .field{height:34px}
.toolbar .search{flex:1;min-width:180px}
.toolbar .search input{width:100%}
.tscroll{overflow:auto;max-height:min(68vh,760px)}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.dt th{position:sticky;top:0;z-index:1;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12.5px;text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td.n,.dt th.n{text-align:end;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.dt tbody tr:hover td{background:var(--surface2)}
.dt tr.sel td{background:var(--brand-soft)}
.dt tr.x td{color:var(--muted)}
.dt tr.x td.n{text-decoration:line-through}
.dt tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:700;border-top:2px solid var(--line2);border-bottom:0}
.dt .cb{width:36px;text-align:center}
.dt input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.tfoot-note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.mini-btn{border:0;background:transparent;color:var(--brand-ink);font-weight:600;font-size:12.5px;padding:2px 6px;border-radius:6px}
.mini-btn:hover{background:var(--brand-soft)}

/* selection bar */
.selbar{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--graphite);color:var(--on-strong);padding:8px 8px 8px 8px;padding-inline-start:16px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.selbar b{font-family:var(--f-num)}
.selbar .btn{height:34px;border-color:transparent}
.selbar .btn.ghost{color:var(--on-strong)}

/* on-screen forms */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.paper-host{background:var(--surface2);border-radius:12px;padding:16px;overflow:auto;display:flex;justify-content:center}
.denoms{width:100%;border-collapse:collapse;font-size:13.5px}
.denoms th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:6px;border-bottom:1px solid var(--line)}
.denoms td{padding:5px 6px;border-bottom:1px solid var(--line)}
.denoms td.n{text-align:end;font-family:var(--f-num)}
.denoms input{width:80px;height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding-inline:8px;font-family:var(--f-num);text-align:center}
.denoms tfoot td{font-weight:700;border-bottom:0}
.vline{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:600}
.vline.ok{background:var(--ok-soft);color:var(--ok)}.vline.bad{background:var(--bad-soft);color:var(--bad)}.vline.warn{background:var(--warn-soft);color:var(--warn)}

/* studio drawer */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:flex-end;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-24px)}}
.studio{width:min(1240px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;animation:slide .22s ease;padding-top:env(safe-area-inset-top,0px)}
.st-h{display:flex;align-items:center;gap:12px;padding:14px max(18px,env(safe-area-inset-left,0px)) 14px max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.st-h .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--on-strong);flex-shrink:0}
.st-h h2{font-size:18px;font-weight:700}
.st-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.st-h .grow{flex:1;min-width:0}
.st-body{flex:1;display:grid;grid-template-columns:390px minmax(0,1fr);min-height:0}
.st-set{overflow:auto;border-inline-end:1px solid var(--line);padding:6px 18px 24px}
.st-prev{overflow:auto;background:var(--surface2);min-width:0;display:flex;flex-direction:column}
.st-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.st-f .grow{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.st-tabs{display:none}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h5{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h5 small{font-weight:500;color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:start;width:100%}
.opt[aria-checked=true]{border-color:var(--brand-ink);background:var(--brand-soft)}
.opt.xl[aria-checked=true]{border-color:var(--xl-ink);background:var(--xl-soft)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:2px;flex-shrink:0}
.opt[aria-checked=true] .dot{border:5px solid var(--brand-ink)}
.opt.xl[aria-checked=true] .dot{border-color:var(--xl-ink)}
.opt b{display:block;font-size:13.5px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding-inline:11px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--graphite);border-color:var(--graphite);color:var(--on-strong)}
.chip.tpl{display:inline-flex;align-items:center;gap:6px}
.chip .x{opacity:.6}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;cursor:pointer}
.tog small{display:block;font-size:12px;color:var(--muted)}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--line2);flex-shrink:0;transition:background .15s;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw[aria-checked=true]{background:var(--brand)}
.sw.xl[aria-checked=true]{background:var(--xl)}
.sw[aria-checked=true]::after{inset-inline-start:18px}
.cols{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.col{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border-bottom:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.col:last-child{border-bottom:0}
.col label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.col input{accent-color:var(--brand);width:16px;height:16px}
.col .mv{border:0;background:transparent;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.col .mv:hover{background:var(--surface2);color:var(--ink)}
.col .mv:disabled{opacity:.3}
.col .ty{font-size:11px;color:var(--muted)}
.sel{width:100%;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding-inline:10px}
.txt{width:100%;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding-inline:10px;font-family:var(--f-num);font-size:13px;direction:rtl}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}

/* excel preview */
.xl-frame{margin:16px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;flex:1}
.xl-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--xl);color:var(--on-strong);font-size:12.5px;font-weight:600}
.xl-fx{display:flex;align-items:center;border-bottom:1px solid var(--line2);font-size:12.5px;direction:ltr}
.xl-fx span{padding:6px 10px;border-inline-end:1px solid var(--line2);min-width:64px;font-family:var(--f-num);color:var(--ink2)}
.xl-fx i{font-style:italic;padding:6px 10px;color:var(--muted);border-inline-end:1px solid var(--line2)}
.xl-fx code{padding:6px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-grid{overflow:auto;flex:1;min-height:260px}
.xl-grid table{border-collapse:collapse;table-layout:fixed;font-size:12px;font-family:Arial,var(--f-body)}
.xl-grid th{background:var(--surface2);color:var(--muted);font-weight:500;border:1px solid var(--line);padding:2px 4px;position:sticky;top:0;z-index:1;font-size:11px}
.xl-grid td{border:1px solid var(--line);padding:0 6px;height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;cursor:cell}
.xl-grid td.rn{background:var(--surface2);color:var(--muted);text-align:center;font-size:11px;width:34px;max-width:none;position:sticky;inset-inline-start:0}
.xl-grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.xl-grid[dir=rtl] td.n{text-align:left}
.xl-grid td.act{outline:2px solid var(--xl);outline-offset:-2px}
.xl-grid tr.k-title td:not(.rn){font-size:15px;font-weight:700;color:var(--brand-ink);height:28px}
.xl-grid tr.k-subtitle td:not(.rn){font-weight:700;font-size:13px}
.xl-grid tr.k-meta td:not(.rn){color:var(--muted);font-size:11px}
.xl-grid tr.k-section td:not(.rn){font-weight:700;color:var(--brand-ink);border-bottom:2px solid var(--brand-ink)}
.xl-grid tr.k-head td:not(.rn){background:var(--graphite);color:var(--on-strong);font-weight:700;text-align:center}
.xl-grid tr.k-group td:not(.rn){background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.xl-grid tr.k-subtotal td:not(.rn){background:var(--surface2);font-weight:700}
.xl-grid tr.k-total td:not(.rn){background:var(--line);font-weight:700;border-top:3px double var(--ink2)}
.xl-grid tr.z td:not(.rn){background:var(--surface2)}
.xl-grid td.hot{background:var(--bad-soft)!important;color:var(--bad)}
.xl-grid td.good{color:var(--ok)}
.xl-grid td.cx{color:var(--muted);text-decoration:line-through}
.xl-grid td.inp{background:var(--warn-soft)!important}
.xl-grid td.fx::before{content:"ƒ";font-size:9px;color:var(--xl-ink);margin-inline-end:3px;font-style:italic}
.xl-tabs{display:flex;gap:2px;padding:0 8px;background:var(--surface2);border-top:1px solid var(--line2);overflow-x:auto}
.xl-tabs button{border:0;background:transparent;padding:7px 14px;font-size:12.5px;color:var(--muted);border-top:3px solid transparent;white-space:nowrap}
.xl-tabs button[aria-pressed=true]{background:var(--surface);color:var(--xl-ink);font-weight:700;border-top-color:var(--xl)}
.xl-more{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* print preview */
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 0;font-size:12.5px;color:var(--muted)}
.pv{padding:16px;display:flex;justify-content:center}
.pv-stack{display:flex;flex-direction:column;gap:18px;align-items:center}
.pv-label{font-size:12px;color:var(--muted);text-align:center;margin-top:-10px}

.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--graphite);color:var(--on-strong);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}

#print-hint{display:none}
@media print{#app,.top{display:none!important}#print-hint{display:block;font:14pt/1.8 var(--f-body);padding:20mm;text-align:center}}

@media (max-width:1060px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:12px;padding-bottom:4px}
  .rail>div{flex-shrink:0}
  .rail nav{flex-direction:row}
  .rail .ri small,.rail-note{display:none}
  .rail .ri{width:auto;white-space:nowrap}
  .g2,.form-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .st-body{grid-template-columns:minmax(0,1fr)}
  .st-tabs{display:flex;padding:8px 16px;border-bottom:1px solid var(--line)}
  .st-body[data-tab=set] .st-prev{display:none}
  .st-body[data-tab=prev] .st-set{display:none}
  .st-set{border-inline-end:0}
}
@media (max-width:560px){
  .top .grow{display:none}
  .field input[type=date]{width:118px}
  .rhead h1{font-size:21px}
  .meter{grid-template-columns:90px minmax(0,1fr) auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi b{font-size:18px}
}
</style>

/* ───────── formatting ───────── */
const money = v => Number(v || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const int = v => Math.round(Number(v || 0)).toLocaleString('en-US');
const pct = v => (Number(v || 0) * 100).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + '%';
const dmy = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '';
const dm = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const r2 = v => Math.round(v * 100) / 100;
const DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const dow = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };
const fmtCell = (v, t, cur) => v == null || v === '' ? '' : t === 'money' ? money(v) + (cur ? ' ₪' : '') : t === 'int' ? int(v) : t === 'pct' ? pct(v) : t === 'date' ? dmy(v) : String(v);
const isNum = t => t === 'money' || t === 'int' || t === 'pct';

const colLetter = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

/* Arabic amount in words, for receipts: «فقط ... شيكلاً و... أغورة لا غير». */
const ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
const ONES_F = ['', 'واحدة', 'اثنتان', 'ثلاث', 'أربع', 'خمس', 'ست', 'سبع', 'ثماني', 'تسع', 'عشر', 'إحدى عشرة', 'اثنتا عشرة', 'ثلاث عشرة', 'أربع عشرة', 'خمس عشرة', 'ست عشرة', 'سبع عشرة', 'ثماني عشرة', 'تسع عشرة'];
const TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
const HUNDS = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
function under100(n, fem) { const o = n % 10, t = Math.floor(n / 10); if (n < 20) return (fem ? ONES_F : ONES)[n]; return o ? `${o === 1 && fem ? 'إحدى' : (fem ? ONES_F : ONES)[o]} و${TENS[t]}` : TENS[t]; }
function under1000(n) { const h = Math.floor(n / 100), r = n % 100; return [h ? HUNDS[h] : '', r ? under100(r) : ''].filter(Boolean).join(' و'); }
function numberWords(n) {
  if (n === 0) return 'صفر';
  const th = Math.floor(n / 1000), r = n % 1000, t100 = th % 100, parts = [];
  if (th) parts.push(th === 1 ? 'ألف' : th === 2 ? 'ألفان' : t100 >= 3 && t100 <= 10 ? `${under1000(th)} آلاف` : t100 >= 11 ? `${under1000(th)} ألفاً` : `${under1000(th)} ألف`);
  if (r) parts.push(under1000(r));
  return parts.join(' و');
}
function amountWords(amount) {
  const sh = Math.floor(amount + 1e-9), ag = Math.round((amount - sh) * 100), r = sh % 100;
  const shekel = sh === 1 ? 'شيكل واحد' : sh === 2 ? 'شيكلان' : `${numberWords(sh)} ${r >= 3 && r <= 10 ? 'شواكل' : r >= 11 ? 'شيكلاً' : 'شيكل'}`;
  const agora = !ag ? '' : ag === 1 ? 'أغورة واحدة' : ag === 2 ? 'أغورتان' : ag <= 10 ? `${under100(ag, true)} أغورات` : `${under100(ag, true)} أغورةً`;
  return `فقط ${sh ? shekel : ''}${sh && ag ? ' و' : ''}${agora} لا غير`;
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Print exactly the pages of the preview: inside the artifact viewer the file is saved and prints when opened; elsewhere a hidden frame prints at once. */
function printDocument(title, html, ps) {
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><link rel="stylesheet" href="${FONTS_URL}"><style>${PAPER_CSS}@page{size:${pageCssSize(ps)};margin:0}html,body{margin:0;background:#fff}.paper{box-shadow:none!important;break-after:page}.paper:last-child{break-after:auto}@media screen{body{background:#e9ecef;padding:10mm 0}.paper{margin:0 auto 8mm;box-shadow:0 2px 14px rgb(0 0 0/.18)!important}}</style></head><body>${html}<script>window.addEventListener('load',function(){(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){window.print()},300)})});<\/script></body></html>`;
}
async function runPrint(title, html, ps, hasDownloads) {
  const doc = printDocument(title, html, ps);
  if (hasDownloads) return saveFile(title.replace(/\s+/g, '-') + '.html', doc);
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;width:0;height:0;border:0;inset-inline-end:0;bottom:0';
  f.srcdoc = doc; document.body.appendChild(f);
  setTimeout(() => f.remove(), 60000);
  return 'printed';
}

function ExcelPreview({sheets, rtl, currency}) {
  const [tab, setTab] = useState(0);
  const [act, setAct] = useState(null);
  const sh = sheets[Math.min(tab, sheets.length - 1)];
  useEffect(() => { setAct(null); }, [tab, sheets]);
  const LIMIT = 70, shown = sh.rows.slice(0, LIMIT);
  const lastShown = shown[shown.length - 1]?.rn || 0;
  const firstFx = useMemo(() => { for (const r of sh.rows) for (let i = 0; i < r.cells.length; i++) if (r.cells[i].f) return {addr: colLetter(i) + r.rn, f: r.cells[i].f}; return null; }, [sh]);
  const a = act || firstFx;
  const condClass = (ci, rn, v) => {
    for (const c of sh.conds) { const [s, e] = c.ref.split(':'); const L = s.replace(/\d+/g, ''); if (colLetter(ci) !== L) continue; const r0 = +s.replace(/\D+/g, ''), r1 = e ? +e.replace(/\D+/g, '') : r0; if (rn < r0 || rn > r1) continue;
      if (c.cond === 'hot' && v > 0) return 'hot'; if (c.cond === 'neg' && v < 0) return 'hot'; if (c.cond === 'ach') return v >= 1 ? 'good' : v < .85 ? 'hot' : ''; if (c.cond === 'cancel' && v === 'ملغى') return 'cx'; }
    return '';
  };
  return (
    <div className="xl-frame">
      <div className="xl-bar"><I n="sheet" s={16} /><span>معاينة المصنّف</span><span style={{marginInlineStart: 'auto', fontWeight: 500}}>{sheets.length} {sheets.length > 2 ? 'أوراق' : sheets.length === 2 ? 'ورقتان' : 'ورقة'}</span></div>
      <div className="xl-fx"><span>{a ? a.addr : 'A1'}</span><i>fx</i><code>{a ? (a.f ? '=' + a.f : String(a.v ?? '')) : ''}</code></div>
      <div className="xl-grid" dir={rtl ? 'rtl' : 'ltr'}>
        <table style={{width: 34 + sh.widths.reduce((s, w) => s + Math.round(w * 7.2), 0)}}>
          <colgroup><col style={{width: 34}} />{sh.widths.map((w, i) => <col key={i} style={{width: Math.round(w * 7.2)}} />)}</colgroup>
          <thead><tr><th />{sh.widths.map((_, i) => <th key={i}>{colLetter(i)}</th>)}</tr></thead>
          <tbody>
            {shown.map(r => {
              const merged = ['title', 'subtitle', 'meta', 'section', 'group'].includes(r.kind) && r.cells.length === 1;
              return (
                <tr key={r.rn} className={'k-' + r.kind + (r.zebra ? ' z' : '')}>
                  <td className="rn">{r.rn}</td>
                  {merged ? <td colSpan={sh.ncols} onClick={() => setAct({addr: 'A' + r.rn, v: r.cells[0].v})}>{r.cells[0].v}</td>
                    : r.kind === 'blank' ? <td colSpan={sh.ncols} />
                    : Array.from({length: sh.ncols}, (_, i) => { const c = r.cells[i] || {v: ''}; const addr = colLetter(i) + r.rn;
                      return <td key={i} className={[isNum(c.t) ? 'n' : '', c.f ? 'fx' : '', c.input ? 'inp' : '', r.kind === 'data' ? condClass(i, r.rn, c.v) : '', a && a.addr === addr ? 'act' : ''].join(' ')} onClick={() => setAct({addr, f: c.f, v: fmtCell(c.v, c.t, currency)})}>{fmtCell(c.v, c.t, currency)}</td>; })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {sh.rows.length > LIMIT && <div className="xl-more">تعرض المعاينة أول {LIMIT} صفاً من {sh.rows.length}. الملف الكامل يحوي كل الصفوف.</div>}
      <div className="xl-tabs" role="tablist">{sheets.map((s, i) => <button key={s.name} type="button" aria-pressed={i === tab} onClick={() => setTab(i)}>{s.name}</button>)}</div>
    </div>
  );
}

function ExcelStudio({rep, ctx, settings, setSettings, selection, handover, initialScope, onClose, toast}) {
  const xs = {...xlDefaults(rep), ...(settings[rep.id]?.excel || {})};
  const [scope, setScope] = useState(initialScope || (selection?.size ? 'selected' : 'report'));
  const [tab, setTab] = useState('set');
  const [busy, setBusy] = useState(false);
  const [tplName, setTplName] = useState('');
  const [saved, setSaved] = useState(() => store.get('pc-xl-templates', []).filter(t => t.rid === rep.id));
  const set = patch => setSettings(s => ({...s, [rep.id]: {...s[rep.id], excel: {...xs, ...patch}}}));
  const effective = {...xs, scope};
  const sheets = useMemo(() => buildSheets(scope, rep, ctx, {...settings, [rep.id]: {...settings[rep.id], excel: effective}}, selection, handover), [scope, settings, ctx, selection, handover]);
  const rows = sheets.reduce((s, x) => s + x.rows.length, 0);
  const defaultName = scope === 'workbook' ? fileName({file: 'مصنف-التحصيل'}, ctx, 'xlsx') : fileName(rep, ctx, 'xlsx');
  const fname = (xs.filename || defaultName).replace(/\.xlsx$/i, '') + '.xlsx';
  const isTable = rep.kind === 'table';

  async function exportNow() {
    setBusy(true);
    try {
      const blob = await writeWorkbook(sheets, effective);
      const res = await saveFile(fname, blob);
      toast(res === 'declined' ? 'لم يُحفظ الملف.' : res === 'busy' ? 'نافذة حفظ مفتوحة بالفعل، أكمِلها أولاً.' : `تم تجهيز «${fname}».`);
    } catch (e) { toast(e && e.message === 'load' ? 'تعذّر تحميل مكتبة Excel. تحقّق من الاتصال وأعد المحاولة.' : 'تعذّر إنشاء الملف. أعد المحاولة.'); }
    setBusy(false);
  }
  function saveTemplate() {
    const name = tplName.trim(); if (!name) return;
    const all = store.get('pc-xl-templates', []).filter(t => !(t.rid === rep.id && t.name === name));
    const t = {id: Date.now().toString(36), rid: rep.id, name, s: {...xs, filename: ''}};
    store.set('pc-xl-templates', [...all, t]); setSaved(s => [...s.filter(x => x.name !== name), t]); setTplName(''); toast(`حُفظ القالب «${name}».`);
  }
  function removeTemplate(id) { store.set('pc-xl-templates', store.get('pc-xl-templates', []).filter(t => t.id !== id)); setSaved(s => s.filter(t => t.id !== id)); }

  return (
    <Drawer onClose={onClose} label="استوديو تصدير Excel">
      <div className="st-h">
        <span className="ic" style={{background: 'var(--xl)'}}><I n="sheet" s={20} /></span>

        <button type="button" className="btn ghost icon" onClick={onClose} aria-label="إغلاق"><I n="x" /></button>
      </div>
      <div className="st-tabs seg"><button type="button" aria-pressed={tab === 'set'} onClick={() => setTab('set')}>الإعدادات</button><button type="button" aria-pressed={tab === 'prev'} onClick={() => setTab('prev')}>المعاينة</button></div>
      <div className="st-body" data-tab={tab}>
        <div className="st-set">
          <div className="sec">
            <h5>ماذا تصدّر</h5>
            <div className="opts" role="radiogroup">

  const stackRef = useRef(null), hostRef = useRef(null);

  const {w} = paperDims(ps);
  useEffect(() => {
    const el = hostRef.current; if (!el) return;

  const pages = rep.kind === 'table' ? TablePages({rep, ctx, ps, selection}) : rep.kind === 'summary' ? SummaryPages({ctx, ps}) : rep.kind === 'handover' ? HandoverPages({ctx, ps, h: handover}) : ReceiptPages({ctx, ps, r: receipt});

  async function go() {

            <Radio on={scope === 'selected'} set={() => setScope('selected')} disabled={!selection?.size} title={`الصفوف المحددة فقط (${int(selection?.size || 0)})`} sub={selection?.size ? 'مثلاً: سندات تحتاج توقيعاً أو مشتركون لإنذارهم' : 'حدّد صفوفاً من الجدول أولاً'} />

function Drawer({children, onClose, label}) {
  useEffect(() => { const k = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); document.documentElement.style.overflow = 'hidden'; return () => { window.removeEventListener('keydown', k); document.documentElement.style.overflow = ''; }; }, []);
  return <div className="scrim" onMouseDown={e => e.target === e.currentTarget && onClose()}><div className="studio" role="dialog" aria-modal="true" aria-label={label}>{children}</div></div>;
}

/* ───────── screen views ───────── */
function DailyChart({days}) {
  const [hover, setHover] = useState(null);
  const W = 720, H = 220, L = 8, Rr = 52, T = 14, B = 30;
  const max0 = Math.max(1, ...days.map(d => d.amount));
  const step = (x => { const p = 10 ** Math.floor(Math.log10(x)), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; })(max0 / 4);
  const max = Math.ceil(max0 / step) * step;
  const bw = (W - L - Rr) / days.length, y = v => T + (H - T - B) * (1 - v / max);
  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} style={{direction: 'ltr'}} role="img" aria-label="التحصيل اليومي بالشيكل">
        {Array.from({length: Math.round(max / step) + 1}, (_, i) => i * step).map(v => <g key={v}><line x1={L} x2={W - Rr + 6} y1={y(v)} y2={y(v)} stroke="var(--line)" strokeWidth="1" /><text x={W - Rr + 12} y={y(v) + 4} fontSize="11" fill="var(--muted)" fontFamily="Alexandria" textAnchor="start">{v >= 1000 ? (v / 1000) + 'k' : v}</text></g>)}
        {days.map((d, i) => { const x = W - Rr - (i + 1) * bw, h = (H - T - B) * d.amount / max, on = hover === i;
          return <g key={d.date} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} onFocus={() => setHover(i)} onBlur={() => setHover(null)} tabIndex={0} aria-label={`${dmy(d.date)}: ${money(d.amount)} شيكل`}>
            <rect x={x} y={T} width={bw} height={H - T - B} fill="transparent" />
            <rect x={x + Math.min(3, bw * .18)} y={y(d.amount)} width={Math.max(2, bw - 2 * Math.min(3, bw * .18))} height={Math.max(0, h)} rx="3" fill="var(--brand)" opacity={hover === null || on ? 1 : .45} />
            {(days.length <= 14 || i % 2 === 0) && <text x={x + bw / 2} y={H - 10} fontSize="10.5" fill="var(--muted)" textAnchor="middle" fontFamily="Alexandria">{d.date.slice(8)}</text>}
          </g>; })}
      </svg>
      {hover !== null && <div className="tip" style={{right: `${((Rr + (hover + .5) * bw) / W) * 100}%`, top: `${(y(days[hover].amount) / H) * 100}%`}}>{DAYS_AR[dow(days[hover].date)]} {dmy(days[hover].date)}<b>{money(days[hover].amount)} ₪</b>{days[hover].count} سند</div>}
    </div>
  );
}

      <div className="card">
        <div className="card-h"><h3>حسب المنطقة</h3><small>{ctx.areas.length} مناطق</small></div>
        <div className="card-b">{K.byArea.map(a => <div className="meter" key={a.name}><span>{a.name}</span><span className="bar"><i style={{width: (a.amount / Math.max(1, ...K.byArea.map(x => x.amount)) * 100) + '%'}} /></span><span className="v">{money(a.amount)}<small>{a.count} سند</small></span></div>)}</div>
      </div>
    </div>
  </>);
}

function TableView({rep, ctx, vf, setVf, selection, setSelection, onReceipt}) {
  const rows = useMemo(() => rep.rows(ctx), [rep, ctx]);
  const cols = rep.columns.filter(c => c.on !== false && (!c.when || c.when(ctx)));
  const sums = useMemo(() => sumRows(rows), [rows]);
  const [limit, setLimit] = useState(150);
  useEffect(() => setLimit(150), [rows]);
  const f = vf[rep.id] || {};
  const setF = patch => setVf(v => ({...v, [rep.id]: {...f, ...patch}}));
  const sel = selection || new Set();
  const allOn = rows.length > 0 && rows.every(r => sel.has(r.id));
  const toggle = id => { const s = new Set(sel); s.has(id) ? s.delete(id) : s.add(id); setSelection(s); };
  const cell = (c, r) => {
    const v = r[c.key];
    if (c.key === 'status' && rep.id === 'journal') return <span className={'tag ' + (r.cancelled ? 'bad' : 'ok')}>{v}</span>;
    if (c.key === 'status' && rep.id === 'recon') return <span className={'tag ' + (v === 'مطابق' ? 'ok' : v === 'عجز' ? 'bad' : 'warn')}>{v}</span>;
    if (c.key === 'action') return <span className={'tag ' + (v === 'إشعار قطع' || v === 'إنذار نهائي' ? 'bad' : v === 'إنذار أول' ? 'warn' : '')}>{v}</span>;
    if (c.key === 'amount' && r.cancelled) return money(r.orig);
    if (c.cond === 'ach') return <span className={v >= 1 ? 'pos' : v < .85 ? 'neg' : ''}>{pct(v)}</span>;
    if (c.cond === 'neg' && v) return <span className={v < 0 ? 'neg' : 'pos'}>{money(v)}</span>;
    if (c.cond === 'hot' && v > 0) return <span className="neg">{money(v)}</span>;
    return fmtCell(v, c.type);
  };
  return (
    <div className="card">
      <div className="toolbar">
        {(rep.id === 'journal' || rep.id === 'aging') && <label className="field search"><I n="search" s={16} /><input id={rep.id + '-q'} placeholder={rep.id === 'journal' ? 'رقم سند، اشتراك، اسم، أو مرجع' : 'رقم اشتراك أو اسم'} value={f.q || ''} onChange={e => setF({q: e.target.value})} aria-label="بحث" /></label>}
        {rep.id === 'journal' && <>
          <label className="field"><small>المحصّل</small><select id="j-col" value={f.collector || ''} onChange={e => setF({collector: e.target.value})}><option value="">الكل</option>{ctx.collectors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></label>
          <label className="field"><small>الطريقة</small><select id="j-met" value={f.method || ''} onChange={e => setF({method: e.target.value})}><option value="">الكل</option>{METHODS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></label>
          <label className="field"><small>الحالة</small><select id="j-st" value={f.status || ''} onChange={e => setF({status: e.target.value})}><option value="">الكل</option><option value="ok">مُرحّل</option><option value="cancelled">ملغى</option></select></label>
        </>}
        {rep.id === 'aging' && <>
          <label className="field"><small>المنطقة</small><select id="a-area" value={f.area || ''} onChange={e => setF({area: e.target.value})}><option value="">الكل</option>{ctx.areas.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</select></label>
          <label className="field"><small>لديه دين</small><select id="a-min" value={f.min || ''} onChange={e => setF({min: e.target.value})}><option value="">أي عمر</option><option value="b61">أكثر من 60 يوماً</option><option value="b91">أكثر من 90 يوماً</option><option value="b181">أكثر من 180 يوماً</option></select></label>
        </>}
        {Object.values(f).some(Boolean) && <button type="button" className="btn ghost sm" onClick={() => setVf(v => ({...v, [rep.id]: {}}))}>مسح التصفية</button>}
      </div>
      <div className="tscroll">
        <table className="dt">
          <thead><tr>
            {rep.selectable && <th className="cb"><input type="checkbox" aria-label="تحديد الكل" checked={allOn} onChange={() => setSelection(allOn ? new Set() : new Set(rows.map(r => r.id)))} /></th>}
            {cols.map(c => <th key={c.key} className={isNum(c.type) ? 'n' : ''}>{c.label}</th>)}
            {rep.id === 'journal' && <th />}
          </tr></thead>
          <tbody>{rows.slice(0, limit).map(r => (
            <tr key={r.id} className={(sel.has(r.id) ? 'sel ' : '') + (r.cancelled ? 'x' : '')}>
              {rep.selectable && <td className="cb"><input type="checkbox" aria-label={`تحديد ${r.no || r.sub}`} checked={sel.has(r.id)} onChange={() => toggle(r.id)} /></td>}
              {cols.map(c => <td key={c.key} className={isNum(c.type) || c.type === 'date' ? 'n' : ''}>{cell(c, r)}</td>)}
              {rep.id === 'journal' && <td><button type="button" className="mini-btn" onClick={() => onReceipt(r.id)} disabled={r.cancelled}>السند</button></td>}
            </tr>))}
          </tbody>
          {rows.length > 0 && <tfoot><tr>
            {rep.selectable && <td />}
            {cols.map((c, i) => <td key={c.key} className={isNum(c.type) ? 'n' : ''}>{c.agg ? fmtCell(aggValue(c, sums), c.type) : i === 0 ? 'الإجمالي' : ''}</td>)}
            {rep.id === 'journal' && <td />}
          </tr></tfoot>}
        </table>
        {rows.length === 0 && <div style={{padding: 32, textAlign: 'center', color: 'var(--muted)'}}>لا توجد سجلات تطابق التصفية. جرّب فترة أطول أو امسح التصفية.</div>}
      </div>
      <div className="tfoot-note"><span>{int(rows.length)} {rep.unit}{rows.length > limit ? ` · يُعرض أول ${int(limit)}` : ''}{rows.length > limit && <button type="button" className="mini-btn" onClick={() => setLimit(l => l + 300)}>عرض المزيد</button>}</span><span>التصدير والطباعة يتبعان هذه التصفية.</span></div>
    </div>
  );
}

function HandoverView({ctx, h, setH}) {
  const D = handoverData(ctx, h);
  const dates = ctx.days.filter(d => dow(d) !== 5);
  const status = D.variance < 0 ? 'bad' : D.variance > 0 ? 'warn' : 'ok';
  return (
    <div className="form-grid">
      <div className="card">
        <div className="card-h"><h3>بيانات التسليم</h3><small>{D.c.box}</small></div>
        <div className="card-b">
          <div className="ctl" style={{marginBottom: 12}}>
            <label className="field"><small>المحصّل</small><select id="h-col" value={D.c.id} onChange={e => setH({...h, collector: e.target.value, counts: null})}>{ctx.collectors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></label>
            <label className="field"><small>اليوم</small><select id="h-day" value={h.date} onChange={e => setH({...h, date: e.target.value, counts: null})}>{dates.map(d => <option key={d} value={d}>{DAYS_AR[dow(d)]} {dmy(d)}</option>)}</select></label>
          </div>
          {D.byMethod.map(m => <div className="meter" key={m.id}><span>{m.name}</span><span className="num" style={{color: 'var(--muted)'}}>{m.count} سند</span><span className="v">{money(m.amount)} ₪</span></div>)}
          <div className="meter" style={{fontWeight: 700}}><span>الإجمالي</span><span className="num">{D.rs.length} سند</span><span className="v">{money(D.total)} ₪</span></div>
        </div>
      </div>
      <div className="card">
        <div className="card-h"><h3>جرد النقد بالفئات</h3><button type="button" className="mini-btn" onClick={() => setH({...h, counts: null})}>إعادة الضبط</button></div>
        <div className="card-b">
          <table className="denoms"><thead><tr><th>الفئة</th><th>العدد</th><th style={{textAlign: 'end'}}>القيمة</th></tr></thead>
            <tbody>{DENOMS.map((d, i) => <tr key={i}><td className="num">{d.v} ₪ <small style={{color: 'var(--muted)'}}>{d.k}</small></td><td><input id={'den-' + i} type="number" min="0" inputMode="numeric" aria-label={`عدد فئة ${d.v}`} value={D.counts[i]} onChange={e => { const c = [...D.counts]; c[i] = Math.max(0, Math.floor(Number(e.target.value) || 0)); setH({...h, counts: c}); }} /></td><td className="n">{money(d.v * (Number(D.counts[i]) || 0))}</td></tr>)}</tbody>
            <tfoot><tr><td>النقد المعدود</td><td /><td className="n">{money(D.counted)}</td></tr></tfoot></table>
          <div className={'vline ' + status}><span>المتوقع {money(D.expected)} ₪ (يشمل فكّة 300)</span><span className="num">{status === 'ok' ? 'مطابق' : status === 'bad' ? 'عجز' : 'زيادة'} {money(Math.abs(D.variance))}</span></div>
        </div>
      </div>
    </div>
  );
}
function ReceiptView({ctx, receipt, setReceiptId}) {
  const list = ctx.receipts.filter(r => !r.cancelled).slice(-200).reverse();
  const ps = {...prDefaults(REPORT.receipt), paper: 'A5', orient: 'landscape', watermark: 'none'};
  return (
    <div className="card">
      <div className="toolbar">
        <label className="field" style={{flex: 1, minWidth: 220}}><small>السند</small><select id="rc-pick" style={{flex: 1}} value={receipt?.id || ''} onChange={e => setReceiptId(e.target.value)}>{list.map(r => <option key={r.id} value={r.id}>{r.no} · {SUB[r.subId].name} · {money(r.amount)} ₪</option>)}</select></label>
        <span className="pill">يمكن فتح أي سند من زر «السند» في يومية التحصيل</span>
      </div>
      <div className="card-b"><div className="paper-host"><div style={{zoom: .82}}>{ReceiptPages({ctx, ps, r: receipt})}</div></div></div>
    </div>
  );
}

/* ───────── app ───────── */
const PRESETS = [{id: 'today', name: 'اليوم', from: TODAY, to: TODAY}, {id: 'week', name: 'هذا الأسبوع', from: '2026-10-24', to: TODAY}, {id: 'month', name: 'هذا الشهر', from: MONTH_START, to: TODAY}];
function App() {
  const [branch, setBranch] = useState('all');
  const [range, setRange] = useState({from: MONTH_START, to: TODAY});
  const [active, setActive] = useState(() => { const h = location.hash.slice(1); return REPORT[h] ? h : store.get('pc-report', 'summary'); });
  const [vf, setVf] = useState({});
  const [selections, setSelections] = useState({});
  const [settings, setSettings] = useState(() => store.get('pc-report-settings', {}));
  const [studio, setStudio] = useState(null);
  const [handover, setHandover] = useState({collector: 'c1', date: TODAY, counts: null});
  const [receiptId, setReceiptId] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [hasDownloads, setHasDownloads] = useState(false);
  useEffect(() => { downloadsPromise.then(d => setHasDownloads(!!d)); }, []);
  useEffect(() => { store.set('pc-report-settings', settings); }, [settings]);
  useEffect(() => { store.set('pc-report', active); }, [active]);
  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(null), 4200); return () => clearTimeout(t); }, [toastMsg]);

  const ctx = useMemo(() => buildCtx(branch, range.from, range.to, vf), [branch, range, vf]);
  const rep = REPORT[active];
  const selection = selections[active];
  const setSelection = s => setSelections(x => ({...x, [active]: s}));
  useEffect(() => { setSelections({}); }, [branch, range]);
  useEffect(() => { if (!ctx.collectors.some(c => c.id === handover.collector) || handover.date < range.from || handover.date > range.to) setHandover(h => ({collector: ctx.collectors.some(c => c.id === h.collector) ? h.collector : ctx.collectors[0].id, date: [...ctx.days].reverse().find(d => dow(d) !== 5) || range.to, counts: null})); }, [ctx]);
  const receiptsOk = ctx.receipts.filter(r => !r.cancelled);
  const receipt = RECEIPTS.find(r => r.id === receiptId && receiptsOk.includes(r)) || receiptsOk[receiptsOk.length - 1];

  useEffect(() => {
    const k = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); setStudio({type: 'print'}); } };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);

  const open = (id, filter) => { setActive(id); setStudio(null); if (filter) setVf(v => ({...v, [id]: {...filter}})); window.scrollTo({top: 0}); };
  const preset = PRESETS.find(p => p.from === range.from && p.to === range.to)?.id || 'custom';
  const selRows = selection?.size ? rep.rows(ctx).filter(r => selection.has(r.id)) : [];
  const selSum = rep.sumKey ? selRows.reduce((s, r) => s + (r[rep.sumKey] || 0), 0) : 0;
  const counts = {journal: ctx.receipts.length, collectors: ctx.collectors.length, aging: ctx.subs.length, recon: ctx.collectors.length};
  const studioProps = {rep, ctx, settings, setSettings, selection, handover, onClose: () => setStudio(null), toast: setToastMsg};

  return (<>
    <header className="top">
      <div className="top-in">
        <div className="brandmark"><img src={LOGO} alt="AF PowerCollect" /><div><b>التقارير المالية</b><small>نماذج وتقارير التحصيل</small></div></div>
        <span className="pill sample">بيانات تجريبية</span>
        <span className="grow" />
        <div className="ctl">
          <label className="field"><I n="pin" s={16} /><select id="branch" aria-label="الفرع" value={branch} onChange={e => setBranch(e.target.value)}><option value="all">كل الفروع</option>{BRANCHES.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></label>
          <div className="seg" role="group" aria-label="الفترة">{PRESETS.map(p => <button key={p.id} type="button" aria-pressed={preset === p.id} onClick={() => setRange({from: p.from, to: p.to})}>{p.name}</button>)}</div>
          <label className="field"><small>من</small><input id="from" type="date" min={MONTH_START} max={range.to} value={range.from} onChange={e => e.target.value && setRange(r => ({...r, from: e.target.value}))} /></label>
          <label className="field"><small>إلى</small><input id="to" type="date" min={range.from} max={TODAY} value={range.to} onChange={e => e.target.value && setRange(r => ({...r, to: e.target.value}))} /></label>
        </div>
      </div>
    </header>
    <main className="wrap">
      <div className="layout">
        <aside className="rail" aria-label="التقارير والنماذج">
          {[['reports', 'تقارير التحصيل'], ['forms', 'نماذج التحصيل']].map(([g, label]) => (
            <div key={g}><h4>{label}</h4><nav>{REPORTS.filter(r => r.group === g).map(r => (
              <button key={r.id} type="button" className="ri" aria-current={active === r.id ? 'page' : undefined} onClick={() => open(r.id)}>
                <span className="ri-ic"><I n={r.icon} s={17} /></span><span><b>{r.title}</b><small>{counts[r.id] != null ? `${int(counts[r.id])} ${r.unit}` : r.desc}</small></span>
              </button>))}</nav></div>
          ))}
          <div className="rail-note">الطباعة والتصدير يخصّان التقرير المفتوح وحده. اختصار <kbd>Ctrl</kbd>+<kbd>P</kbd> يفتح طباعة هذا التقرير بدل طباعة الصفحة كاملة.</div>
        </aside>
        <section style={{minWidth: 0}}>
          <div className="rhead">
            <div className="t"><h1>{rep.title}</h1><p>{rep.desc} · {ctx.branchLabel} · <span className="num">{dmy(ctx.from)}{ctx.from !== ctx.to ? ' – ' + dmy(ctx.to) : ''}</span></p></div>
            <div className="acts">
              {!rep.noExcel && <button type="button" className="btn xl-soft" onClick={() => setStudio({type: 'excel'})}><I n="sheet" s={17} />تصدير Excel</button>}
              <button type="button" className="btn" onClick={() => setStudio({type: 'print'})}><I n="printer" s={17} />طباعة</button>
              {rep.group === 'reports' && <button type="button" className="btn ghost" onClick={() => setStudio({type: 'excel', scope: 'workbook'})} title="ورقة لكل تقرير في ملف واحد"><I n="book" s={17} />المصنّف الكامل</button>}
            </div>
          </div>
          {rep.kind === 'summary' && <SummaryView ctx={ctx} open={open} />}
          {rep.kind === 'table' && <TableView key={rep.id} rep={rep} ctx={ctx} vf={vf} setVf={setVf} selection={selection} setSelection={setSelection} onReceipt={id => { setReceiptId(id); setActive('receipt'); window.scrollTo({top: 0}); }} />}
          {rep.kind === 'handover' && <HandoverView ctx={ctx} h={handover} setH={setHandover} />}
          {rep.kind === 'receipt' && <ReceiptView ctx={ctx} receipt={receipt} setReceiptId={setReceiptId} />}
        </section>
      </div>
    </main>
    {rep.selectable && selection?.size > 0 && !studio && (
      <div className="selbar" role="region" aria-label="الصفوف المحددة">
        <span>تم تحديد <b>{int(selection.size)}</b> {rep.unit}{rep.sumKey ? <> · المجموع <b>{money(selSum)} ₪</b></> : null}</span>
        <button type="button" className="btn sm" onClick={() => setStudio({type: 'print'})}><I n="printer" s={15} />طباعة المحدد</button>
        <button type="button" className="btn sm xl" onClick={() => setStudio({type: 'excel', scope: 'selected'})}><I n="sheet" s={15} />تصدير المحدد</button>
        <button type="button" className="btn sm ghost" onClick={() => setSelection(new Set())}>إلغاء التحديد</button>
      </div>
    )}
    {studio?.type === 'excel' && <ExcelStudio key={'x' + active + (studio.scope || '')} {...studioProps} initialScope={studio.scope} />}
    {studio?.type === 'print' && <PrintStudio key={'p' + active} {...studioProps} receipt={receipt} hasDownloads={hasDownloads} />}
    {toastMsg && <div className="toast" role="status"><I n="check" s={17} />{toastMsg}</div>}
  </>);
}

const style = document.createElement('style'); style.textContent = PAPER_CSS; document.head.appendChild(style);
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
