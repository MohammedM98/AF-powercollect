<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PowerCollect Top Navigation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/*
 * Layout: a two-row sticky top bar replaces the 288px sidebar. Row one holds
 * the brand, search and account; row two holds the five task groups, each
 * opening a dropdown of its pages. Phones keep the slide-in drawer.
 * Tokens are copied from resources/css/app.css (RGB triples).
 */
:root {
    --brand-50: 251 241 241; --brand-100: 244 214 216; --brand-400: 196 81 90;
    --brand-500: 165 29 38; --brand-600: 143 24 32;
    --gray-50: 239 241 244; --gray-100: 233 236 239; --gray-200: 223 226 230; --gray-300: 205 211 218;
    --gray-400: 94 103 115; --gray-500: 76 84 96; --gray-600: 70 78 89; --gray-700: 53 60 70;
    --gray-800: 35 42 51; --gray-900: 17 24 32;
    --surface: 255 255 255;
    --graphite-700: 38 44 51; --graphite-800: 27 32 38; --graphite-900: 17 21 25;
    --silver: 154 163 174;
    --spectrum: linear-gradient(90deg, #5c0d14, #a51d26 40%, #9aa3ae 75%, #dfe3e8);
    --graphite-gradient: linear-gradient(135deg, #262c33, #1b2026 60%, #111519);
    --brand-gradient: linear-gradient(180deg, #b8232c, #7d121b);
    --shadow-card: 0 1px 2px rgb(16 24 40 / 0.04), 0 14px 34px -18px rgb(16 24 40 / 0.18);
    --shadow-lift: 0 2px 6px rgb(16 24 40 / 0.06), 0 24px 44px -20px rgb(16 24 40 / 0.32);
    --shadow-glow: 0 10px 24px -12px rgb(165 29 38 / 0.9);
    --dark-ring: 0 0 0 0 transparent;

    --font-sans: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
    --font-luxe: 'El Messiri', 'IBM Plex Sans Arabic', Georgia, serif;
    --font-display: 'Alexandria', 'IBM Plex Sans Arabic', system-ui, sans-serif;
    --gutter-sm: 16px; --gutter-lg: 40px;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --brand-50: 42 16 19; --brand-100: 58 20 24; --brand-400: 196 70 78;
        --brand-500: 184 35 44; --brand-600: 222 92 100;
        --gray-50: 11 13 16; --gray-100: 27 31 37; --gray-200: 37 42 50; --gray-300: 52 58 67;
        --gray-400: 128 137 149; --gray-500: 158 166 177; --gray-600: 184 190 199; --gray-700: 204 209 216;
        --gray-800: 226 229 233; --gray-900: 244 245 247;
        --surface: 20 23 28;
        --spectrum: linear-gradient(90deg, #5c0d14, #b8232c 40%, #6b7480 75%, #252a32);
        --dark-ring: 0 0 0 1px rgb(255 255 255 / 0.1);
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --brand-50: 42 16 19; --brand-100: 58 20 24; --brand-400: 196 70 78;
    --brand-500: 184 35 44; --brand-600: 222 92 100;
    --gray-50: 11 13 16; --gray-100: 27 31 37; --gray-200: 37 42 50; --gray-300: 52 58 67;
    --gray-400: 128 137 149; --gray-500: 158 166 177; --gray-600: 184 190 199; --gray-700: 204 209 216;
    --gray-800: 226 229 233; --gray-900: 244 245 247;
    --surface: 20 23 28;
    --spectrum: linear-gradient(90deg, #5c0d14, #b8232c 40%, #6b7480 75%, #252a32);
    --dark-ring: 0 0 0 1px rgb(255 255 255 / 0.1);
}

*, *::before, *::after { box-sizing: border-box; }
body {
    background: rgb(var(--gray-50));
    color: rgb(var(--gray-900));
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
}
h1, h2 { font-family: var(--font-luxe); text-wrap: balance; margin: 0; }
h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid rgb(var(--gray-900)); outline-offset: 2px; }

.gutter {
    padding-left: max(var(--gutter-sm), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter-sm), env(safe-area-inset-right, 0px));
}
@media (min-width: 1024px) {
    .gutter {
        padding-left: max(var(--gutter-lg), env(safe-area-inset-left, 0px));
        padding-right: max(var(--gutter-lg), env(safe-area-inset-right, 0px));
    }
}
.container { max-width: 1536px; margin-inline: auto; }

.skip-link {
    position: absolute; inset-inline-start: 16px; top: -100px; z-index: 70;
    padding: 12px 16px; border-radius: 8px; background: rgb(var(--surface)); color: rgb(var(--gray-900));
}
.skip-link:focus { top: 16px; }

/* ── Top bar ─────────────────────────────────────────────── */
.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: rgb(var(--surface) / 0.8);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid rgb(var(--gray-100));
}
.bar-row { display: flex; align-items: center; gap: 12px; height: 72px; }

.icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 12px; border: 1px solid rgb(var(--gray-200));
    background: rgb(var(--surface)); color: rgb(var(--gray-700));
    box-shadow: 0 1px 2px rgb(16 24 40 / 0.05);
    cursor: pointer; position: relative;
    transition: border-color 150ms, color 150ms;
}
.icon-btn:hover { border-color: rgb(var(--gray-300)); color: rgb(var(--gray-900)); }
.icon-btn svg { width: 20px; height: 20px; }
.badge {
    position: absolute; top: -5px; inset-inline-end: -5px;
    min-width: 20px; height: 20px; padding-inline: 5px;
    border-radius: 999px; background: rgb(var(--brand-500)); color: #fff;
    font-family: var(--font-display); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center;
    border: 2px solid rgb(var(--surface));
}

.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; border-radius: 8px; padding-block: 4px; }
.brand img { height: 44px; width: auto; }
.brand-divider { width: 1px; height: 36px; background: rgb(var(--gray-200)); }
.brand-name { display: block; font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
.brand-branch { display: block; font-size: 0.875rem; color: rgb(var(--gray-500)); line-height: 1.5; }

.search {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0; max-width: 26rem; margin-inline-start: 16px;
    padding: 10px 14px; border-radius: 12px; border: 1px solid rgb(var(--gray-200));
    background: rgb(var(--surface)); color: rgb(var(--gray-400));
    font-size: 1rem; text-align: start; cursor: pointer;
    box-shadow: 0 1px 2px rgb(16 24 40 / 0.05);
}
.search:hover { border-color: rgb(var(--gray-300)); }
.search svg { width: 18px; height: 18px; }
.search span:first-of-type { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbd {
    display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 6px;
    border: 1px solid rgb(var(--gray-200)); background: rgb(var(--surface));
    font-family: var(--font-display); font-size: 12px; font-weight: 600; color: rgb(var(--gray-500));
}
.bar-actions { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; }

.user-btn {
    display: flex; align-items: center; gap: 10px; height: 44px; padding-inline: 4px 10px;
    border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer;
}
.user-btn:hover, .user-btn[aria-expanded="true"] { background: rgb(var(--gray-100)); }
.avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--graphite-gradient); color: #fff; font-weight: 600; font-size: 1rem;
    box-shadow: var(--dark-ring);
}
.user-text { text-align: start; line-height: 1.3; }
.user-text b { display: block; font-size: 0.95rem; }
.user-text small { display: block; font-size: 0.8rem; color: rgb(var(--gray-500)); }
.user-btn > svg { width: 16px; height: 16px; color: rgb(var(--gray-500)); }

/* Row two: the task groups */
.nav-row { border-top: 1px solid rgb(var(--gray-100)); }
.nav-scroll {
    display: flex; align-items: center; gap: 4px; height: 58px;
    overflow-x: auto; scrollbar-width: none;
}
.nav-scroll::-webkit-scrollbar { display: none; }
.nav-item {
    display: inline-flex; align-items: center; gap: 8px; height: 42px; padding-inline: 14px;
    border-radius: 12px; border: 0; background: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; color: rgb(var(--gray-600)); white-space: nowrap;
    transition: background-color 150ms, color 150ms;
}
.nav-item svg { width: 19px; height: 19px; color: rgb(var(--gray-500)); }
.nav-item .chev { width: 15px; height: 15px; transition: transform 200ms; }
.nav-item[aria-expanded="true"] .chev { transform: rotate(180deg); }
.nav-item:hover, .nav-item[aria-expanded="true"] { background: rgb(var(--gray-100)); color: rgb(var(--gray-900)); }
.nav-item:hover svg { color: rgb(var(--gray-700)); }
/* A link that is the current page: the sidebar's burgundy tint and edge, turned to sit under it. */
.nav-item[aria-current="page"] {
    background: rgb(var(--brand-50)); color: rgb(var(--brand-600));
    box-shadow: inset 0 -3px 0 rgb(var(--brand-600));
}
.nav-item[aria-current="page"] svg { color: rgb(var(--brand-600)); }
/* A group that holds the current page: the sidebar's graphite heading. */
.nav-item[data-active="true"] {
    background: var(--graphite-gradient); color: #fff;
    box-shadow: inset 0 -3px 0 rgb(var(--brand-500)), 0 14px 26px -14px rgb(16 24 40 / 0.55), var(--dark-ring);
}
.nav-item[data-active="true"] svg, .nav-item[data-active="true"]:hover svg { color: rgb(var(--silver)); }
.nav-sep { width: 1px; height: 24px; background: rgb(var(--gray-200)); margin-inline: 6px; flex-shrink: 0; }
.nav-current {
    margin-inline-start: auto; padding-inline-start: 16px;
    font-size: 0.875rem; color: rgb(var(--gray-500)); white-space: nowrap;
}
.nav-current b { color: rgb(var(--gray-800)); font-weight: 600; }

/* Dropdown of a group's pages */
.mega {
    position: fixed; z-index: 40;
    width: min(37rem, calc(100vw - 32px));
    padding: 18px 12px 12px;
    border-radius: 24px; border: 1px solid rgb(var(--gray-100));
    background: rgb(var(--surface));
    box-shadow: var(--shadow-lift), var(--dark-ring);
    animation: drop 170ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.mega::before {
    content: ''; position: absolute; top: -1px; inset-inline: 28px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgb(var(--brand-500) / 0.55));
}
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.mega-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 12px 10px; }
.mega-head h3 { font-size: 1rem; font-weight: 700; }
.mega-head span { font-size: 0.875rem; color: rgb(var(--gray-500)); }
.mega-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.mega-grid.single { grid-template-columns: minmax(0, 1fr); }
.mega-link {
    display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 18px;
    transition: background-color 150ms;
}
.mega-link:hover, .mega-link:focus-visible { background: rgb(var(--gray-50)); }
.mega-link:focus-visible { outline-offset: -2px; }
.tile {
    display: flex; align-items: center; justify-content: center; width: 42px; height: 42px;
    border-radius: 12px; border: 1px solid rgb(var(--gray-100)); background: rgb(var(--gray-50));
    color: rgb(var(--gray-500));
}
.tile svg { width: 20px; height: 20px; }
.mega-link:hover .tile { background: rgb(var(--surface)); color: rgb(var(--gray-800)); }
.mega-link b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.4; }
.mega-link small { display: block; font-size: 0.85rem; color: rgb(var(--gray-500)); line-height: 1.5; }
.mega-link[aria-current="page"] { background: rgb(var(--brand-50)); box-shadow: inset -3px 0 0 rgb(var(--brand-600)); }
.mega-link[aria-current="page"] b { color: rgb(var(--brand-600)); }
.mega-link[aria-current="page"] .tile { background: rgb(var(--brand-500) / 0.1); border-color: transparent; color: rgb(var(--brand-600)); }
.mega-foot {
    display: flex; align-items: center; gap: 8px; margin: 10px 4px 0; padding: 10px 8px 0;
    border-top: 1px solid rgb(var(--gray-100)); font-size: 0.85rem; color: rgb(var(--gray-500));
}

/* Account menu */
.menu {
    position: fixed; z-index: 40; width: 16rem; padding: 8px;
    border-radius: 18px; border: 1px solid rgb(var(--gray-100)); background: rgb(var(--surface));
    box-shadow: var(--shadow-lift), var(--dark-ring);
    animation: drop 170ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.menu-head { padding: 8px 10px 12px; border-bottom: 1px solid rgb(var(--gray-100)); margin-bottom: 6px; }
.menu-head b { display: block; }
.menu-head small { display: block; color: rgb(var(--gray-500)); font-size: 0.85rem; }
.menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 10px;
    border: 0; border-radius: 10px; background: none; cursor: pointer; font-size: 1rem; color: rgb(var(--gray-700)); text-align: start;
}
.menu-item svg { width: 20px; height: 20px; color: rgb(var(--gray-500)); }
.menu-item:hover { background: rgb(var(--gray-50)); color: rgb(var(--gray-900)); }
.menu-item.danger:hover, .menu-item.danger:hover svg { background: rgb(var(--brand-50)); color: rgb(var(--brand-600)); }

/* ── Phone drawer (unchanged idea from today's sidebar) ─── */
.drawer {
    position: fixed; inset-block: 0; inset-inline-start: 0; inset-inline-end: auto;
    margin: 0; width: min(18rem, 85vw); height: 100dvh; max-height: none; max-width: none;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    border: 0; background: rgb(var(--surface)); color: rgb(var(--gray-900));
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
}
.drawer::backdrop { background: rgb(var(--graphite-900) / 0.6); backdrop-filter: blur(4px); }
.drawer-inner { display: flex; flex-direction: column; height: 100%; }
.drawer-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; font-size: 0.875rem; font-weight: 600; color: rgb(var(--gray-500)); }
.drawer-top button { border: 0; background: none; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.drawer-top button svg { width: 20px; height: 20px; }
.drawer .brand { padding: 16px 24px; }
.drawer nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.side-link {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; border-radius: 8px;
    font-size: 1rem; color: rgb(var(--gray-700));
}
.side-link svg { width: 20px; height: 20px; color: rgb(var(--gray-500)); }
.side-link:hover { background: rgb(var(--gray-50)); }
.side-link[aria-current="page"] { background: rgb(var(--brand-50)); color: rgb(var(--brand-600)); font-weight: 600; box-shadow: inset -3px 0 0 rgb(var(--brand-600)); }
.side-link[aria-current="page"] svg { color: rgb(var(--brand-600)); }
.side-group { border-top: 1px solid rgb(var(--gray-200)); padding-top: 8px; }
.side-group > button {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px;
    border: 0; border-radius: 16px; background: none; cursor: pointer; text-align: start;
    font-size: 1rem; font-weight: 600; color: rgb(var(--gray-500));
}
.side-group > button span { flex: 1; }
.side-group > button svg { width: 16px; height: 16px; transition: transform 200ms; }
.side-group > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.side-group > button[data-active="true"] {
    background: var(--graphite-gradient); color: #fff;
    box-shadow: inset -3px 0 0 rgb(var(--brand-500)), 0 14px 26px -14px rgb(16 24 40 / 0.55), var(--dark-ring);
}
.side-group .links { padding-block: 4px; }
.drawer-foot { display: flex; align-items: center; gap: 10px; margin-inline: 16px; padding-block: 12px; border-top: 1px solid rgb(var(--gray-200)); }
.drawer-foot .user-text { flex: 1; min-width: 0; }

/* ── Search palette ───────────────────────────────────────── */
.palette {
    width: min(36rem, calc(100vw - 32px)); max-height: min(32rem, 80dvh); margin: 10vh auto auto; padding: 0;
    border: 1px solid rgb(var(--gray-100)); border-radius: 24px; background: rgb(var(--surface)); color: rgb(var(--gray-900));
    box-shadow: var(--shadow-lift), var(--dark-ring); overflow: hidden;
}
.palette::backdrop { background: rgb(var(--graphite-900) / 0.5); backdrop-filter: blur(4px); }
.palette-field { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid rgb(var(--gray-100)); }
.palette-field svg { width: 20px; height: 20px; color: rgb(var(--gray-400)); }
.palette-field input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: inherit; outline: none; }
.palette-field input::placeholder { color: rgb(var(--gray-400)); }
.palette-list { max-height: 24rem; overflow-y: auto; padding: 8px; }
.palette-list .group-label { padding: 8px 10px 4px; font-size: 0.85rem; font-weight: 600; color: rgb(var(--gray-500)); }
.palette-list a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; }
.palette-list a svg { width: 18px; height: 18px; color: rgb(var(--gray-500)); }
.palette-list a:hover, .palette-list a.is-first { background: rgb(var(--gray-50)); }
.palette-empty { padding: 24px; text-align: center; color: rgb(var(--gray-500)); font-size: 0.95rem; }

/* ── Page content ─────────────────────────────────────────── */
main { padding-block: 32px 48px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; color: rgb(var(--gray-500)); margin-bottom: 4px; }
.crumbs svg { width: 14px; height: 14px; }
.page-head h2 { font-size: 2rem; font-weight: 700; line-height: 1.3; }
.page-head h2 em { font-style: normal; color: rgb(var(--brand-600)); }
.page-head p { margin-top: 4px; font-size: 1rem; color: rgb(var(--gray-500)); }
.add-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 12px;
    background: var(--brand-gradient); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: var(--shadow-glow);
}
.add-btn svg { width: 18px; height: 18px; }
.add-btn:hover { filter: brightness(1.1); }

.stack { display: flex; flex-direction: column; gap: 24px; }
.hero {
    position: relative; overflow: hidden; border-radius: 32px; padding: 36px 32px;
    background: var(--graphite-gradient); color: #fff; box-shadow: var(--shadow-lift), var(--dark-ring);
}
.hero::after {
    content: ''; position: absolute; bottom: -96px; inset-inline-start: -40px; width: 288px; height: 288px; border-radius: 999px;
    background: rgb(165 29 38 / 0.25); filter: blur(64px); pointer-events: none;
}
.hero-row { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px; }
.hero-label { font-size: 1rem; font-weight: 600; color: #cdd3da; }
.hero-num {
    margin-top: 8px; font-family: var(--font-display); font-size: clamp(3.5rem, 9vw, 4.5rem); font-weight: 700; line-height: 1;
    background: linear-gradient(180deg, #fff, #9aa3ae); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
}
.hero-sub { margin-top: 12px; font-size: 1rem; color: #9aa3ae; }
.spectrum { position: relative; z-index: 1; height: 3px; width: 160px; border-radius: 999px; background: var(--spectrum); margin-top: 28px; }
.hero-note { position: relative; z-index: 1; margin-top: 12px; font-size: 0.875rem; color: #9aa3ae; }

.ring { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring svg { transform: rotate(-90deg); }
.ring span { position: absolute; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.stat {
    display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 24px;
    border: 1px solid rgb(var(--gray-100)); background: rgb(var(--surface)); box-shadow: var(--shadow-card);
}
.stat-num { font-family: var(--font-display); font-size: 1.625rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.95rem; color: rgb(var(--gray-500)); }

.table-card { border-radius: 28px; overflow: hidden; border: 1px solid rgb(var(--gray-100)); }
.table-toolbar {
    position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 24px; background: rgb(var(--surface)); border-bottom: 1px solid rgb(var(--gray-100));
}
.table-toolbar::before {
    content: ''; position: absolute; top: 0; inset-inline: 28px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgb(var(--brand-500) / 0.55));
}
.table-toolbar h3 { font-size: 1.1rem; }
.table-toolbar small { color: rgb(var(--gray-500)); font-size: 0.9rem; }
.tray { padding: 6px 16px 14px; background: rgb(var(--gray-50)); display: flex; flex-direction: column; gap: 10px; }
.tray-row {
    display: grid; grid-template-columns: 2fr 1.2fr 1fr 0.8fr; gap: 16px; align-items: center;
    padding: 16px 18px; border-radius: 18px; border: 1px solid rgb(var(--gray-100)); background: rgb(var(--surface));
}
.bar { height: 12px; border-radius: 999px; background: rgb(var(--gray-100)); }
.bar.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.tray-note { padding: 14px 24px; background: rgb(var(--surface)); border-top: 1px solid rgb(var(--gray-100)); font-size: 0.95rem; color: rgb(var(--gray-500)); }

.notes {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 24px; border-radius: 24px;
    border: 1px dashed rgb(var(--gray-300)); background: rgb(var(--surface));
}
@media (min-width: 900px) { .notes { grid-template-columns: 16rem minmax(0, 1fr); } }
.notes h3 { font-size: 1.1rem; }
.notes > div > p { margin-top: 6px; font-size: 0.95rem; color: rgb(var(--gray-500)); }
.proto-chip {
    display: inline-block; margin-bottom: 8px; padding: 2px 10px; border-radius: 999px;
    background: rgb(var(--brand-500) / 0.1); color: rgb(var(--brand-600)); font-size: 0.8rem; font-weight: 600;
}
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 12px; }
.notes li { display: flex; gap: 12px; padding: 14px; border-radius: 18px; background: rgb(var(--gray-50)); font-size: 0.95rem; }
.notes li .tile { width: 36px; height: 36px; background: rgb(var(--surface)); }
.notes li b { display: block; }
.notes li span { color: rgb(var(--gray-600)); }

/* ── Breakpoints ─────────────────────────────────────────── */
.lg-only { display: none; }
@media (min-width: 1024px) {
    .lg-only { display: block; }
    .sm-only { display: none !important; }
}
@media (max-width: 1279px) {
    .user-text.in-bar, .nav-current { display: none; }
    .nav-item { padding-inline: 10px; gap: 6px; }
    .nav-item[data-group] svg:not(.chev) { display: none; }
    .dash-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
@media (max-width: 1023px) {
    .bar-row { height: 64px; gap: 8px; }
    .brand-divider, .brand-text { display: none; }
    .brand img { height: 36px; }
    .search { margin-inline-start: 4px; }
}
@media (max-width: 560px) {
    .search span, .search .kbd { display: none; }
    .search { flex: 0 0 44px; width: 44px; height: 44px; padding: 0; justify-content: center; color: rgb(var(--gray-700)); }
    .search svg { width: 20px; height: 20px; }
    .user-btn > svg { display: none; }
    .user-btn { padding: 0; }
    .hero { padding: 28px 22px; }
    .tray-row { grid-template-columns: 2fr 1fr; }
    .tray-row .bar:nth-child(n+3) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

/* ── Top bar groups ───────────────────────────────────────── */
function renderNav() {
    const activeGroup = groupOf(state.current);
    const dashboard = byHref.get('/dashboard');
    const page = current();

    $('nav-scroll').innerHTML = `
        <a href="#" class="nav-item" data-href="/dashboard" title="${dashboard.label}" ${state.current === '/dashboard' ? 'aria-current="page"' : ''}>${icon(dashboard.icon)}<span class="dash-label">${dashboard.label}</span></a>
        <span class="nav-sep" aria-hidden="true"></span>
        ${GROUPS.map((group) => `
            <button type="button" class="nav-item" data-group="${group.id}"
                aria-expanded="${state.openGroup === group.id}" aria-controls="mega"
                ${activeGroup?.id === group.id ? 'data-active="true"' : ''}>
                ${icon(group.icon)}${group.label}${icon('chevron-down', 'chev')}
            </button>`).join('')}
        ${activeGroup ? `<span class="nav-current">أنت في <b>${page.label}</b></span>` : ''}`;
}

function renderMega() {
    const mega = $('mega');
    const group = GROUPS.find((item) => item.id === state.openGroup);

    if (!group) {
        mega.hidden = true;
        return;
    }

    mega.setAttribute('aria-label', group.label);
    mega.innerHTML = `
        <div class="mega-head"><h3>${group.label}</h3><span>${group.hrefs.length} صفحات</span></div>
        <div class="mega-grid ${group.hrefs.length <= 3 ? 'single' : ''}">
            ${group.hrefs.map((href) => {
                const link = byHref.get(href);
                return `<a href="#" class="mega-link" data-href="${href}" ${href === state.current ? 'aria-current="page"' : ''}>
                    <span class="tile">${icon(link.icon)}</span>
                    <span><b>${link.label}</b><small>${link.hint}</small></span>
                </a>`;
            }).join('')}
        </div>
        <div class="mega-foot">${icon('search')}<span>تبحث عن صفحة أخرى؟ اضغط <span class="kbd" dir="ltr">Ctrl K</span></span></div>`;
    mega.hidden = false;
    placeUnder(mega, document.querySelector(`[data-group="${group.id}"]`), 'start');
}

/** Puts a floating panel under its button; in RTL its right edge meets the button's right edge ('start') or its left edge the button's left edge ('end'). */
function placeUnder(panel, anchor, align) {
    const rect = anchor.getBoundingClientRect();
    const viewport = document.documentElement.clientWidth;
    const width = panel.offsetWidth;
    panel.style.top = `${rect.bottom + 8}px`;
    panel.style.left = 'auto';

    let right = align === 'start' ? viewport - rect.right : viewport - rect.left - width;
    right = Math.min(Math.max(16, right), viewport - width - 16);
    panel.style.right = `${Math.max(16, right)}px`;
}

function syncExpanded() {
    document.querySelectorAll('[data-group]').forEach((trigger) => trigger.setAttribute('aria-expanded', String(trigger.dataset.group === state.openGroup)));
}

function openGroup(id, focusFirst = false) {
    closeUserMenu();
    state.openGroup = id;
    syncExpanded();
    renderMega();
    if (focusFirst) {
        $('mega').querySelector('.mega-link')?.focus();
    }
}

function closeGroup(returnFocus = false) {
    const id = state.openGroup;
    if (!id) {
        return;
    }
    state.openGroup = null;
    syncExpanded();
    renderMega();
    if (returnFocus) {
        document.querySelector(`[data-group="${id}"]`)?.focus();
    }
}

/* ── Account menu ─────────────────────────────────────────── */
function toggleUserMenu() {
    const menu = $('user-menu');
    const willOpen = menu.hidden;
    closeGroup();
    menu.hidden = !willOpen;
    $('user-btn').setAttribute('aria-expanded', String(willOpen));
    if (willOpen) {
        placeUnder(menu, $('user-btn'), 'end');
        menu.querySelector('.menu-item').focus();
    }
}

function closeUserMenu(returnFocus = false) {
    if ($('user-menu').hidden) {
        return;
    }
    $('user-menu').hidden = true;
    $('user-btn').setAttribute('aria-expanded', 'false');
    if (returnFocus) {
        $('user-btn').focus();
    }
}

/* ── Phone drawer ─────────────────────────────────────────── */
function renderDrawer() {
    const activeGroup = groupOf(state.current);
    if (activeGroup) {
        state.drawerOpen.add(activeGroup.id);
    }
    const sideLink = (link) => `<a href="#" class="side-link" data-href="${link.href}" ${link.href === state.current ? 'aria-current="page"' : ''}>${icon(link.icon)}<span>${link.label}</span></a>`;

    $('drawer-inner').innerHTML = `
        <div class="drawer-top"><span>القائمة الرئيسية</span><button type="button" id="drawer-close" aria-label="إغلاق القائمة">${icon('close')}</button></div>
        <a href="#" class="brand" data-href="/dashboard"><img src="${document.querySelector('.brand img').src}" alt="AF PowerCollect"><span class="brand-divider" aria-hidden="true" style="display:block"></span><span><span class="brand-name">PowerCollect</span><span class="brand-branch">فرع الكرادة</span></span></a>
        <nav aria-label="القائمة الرئيسية">
            ${sideLink(byHref.get('/dashboard'))}
            ${GROUPS.map((group) => {
                const open = state.drawerOpen.has(group.id);
                return `<div class="side-group">
                    <button type="button" data-side-group="${group.id}" aria-expanded="${open}" ${activeGroup?.id === group.id ? 'data-active="true"' : ''}><span>${group.label}</span>${icon('chevron-down')}</button>
                    <div class="links" ${open ? '' : 'hidden'}>${group.hrefs.map((href) => sideLink(byHref.get(href))).join('')}</div>
                </div>`;
            }).join('')}
        </nav>
        <div class="drawer-foot">
            <span class="avatar" aria-hidden="true">م</span>
            <span class="user-text"><b>مدير النظام</b><small>مسؤول عام</small></span>
            <button type="button" class="icon-btn" aria-label="تسجيل الخروج" style="border:0;box-shadow:none">${icon('logout')}</button>
        </div>`;
}

function setDrawer(open) {
    const drawer = $('drawer');
    $('drawer-btn').setAttribute('aria-expanded', String(open));
    if (open && !drawer.open) {
        renderDrawer();
        drawer.showModal();
        $('drawer-close').focus();
    } else if (!open && drawer.open) {
        drawer.close();
    }
}

/* ── Search palette ───────────────────────────────────────── */
function renderPalette() {
    const query = $('palette-q').value.trim();
    const sections = [{ label: 'عام', hrefs: ['/dashboard'] }, ...GROUPS.map((group) => ({ label: group.label, hrefs: group.hrefs }))]
        .map((section) => ({ ...section, links: section.hrefs.map((href) => byHref.get(href)).filter((link) => !query || link.label.includes(query) || link.hint?.includes(query)) }))
        .filter((section) => section.links.length);

    let first = true;
    $('palette-list').innerHTML = sections.length
        ? sections.map((section) => `<div class="group-label">${section.label}</div>${section.links.map((link) => {
            const html = `<a href="#" data-href="${link.href}" class="${first ? 'is-first' : ''}">${icon(link.icon)}${link.label}</a>`;
            first = false;
            return html;
        }).join('')}`).join('')
        : `<p class="palette-empty">لا توجد صفحة باسم «${query.replace(/[<>&"]/g, '')}»</p>`;
}

function openPalette() {
    closeGroup();
    closeUserMenu();
    setDrawer(false);
    $('palette-q').value = '';
    renderPalette();
    $('palette').showModal();
    $('palette-q').focus();
}

/* ── Page content ─────────────────────────────────────────── */
function ring(percent, size, color, track, labelSize) {
    const radius = (size - 10) / 2;
    const circumference = 2 * Math.PI * radius;
    return `<span class="ring" style="width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}" aria-hidden="true">
            <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" style="stroke:${track}" stroke-width="8"/>
            <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" style="stroke:${color}" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference * (1 - percent / 100)}"/>
        </svg>
        <span style="font-size:${labelSize}">${percent}%</span>
    </span>`;
}

const NOTES = `
    <section class="notes" aria-labelledby="notes-title">
        <div>
            <span class="proto-chip">نموذج أولي</span>
            <h3 id="notes-title">شريط علوي بدل القائمة الجانبية</h3>
            <p>نفس الصفحات والمجموعات والصلاحيات. تغيّر مكان القائمة فقط.</p>
        </div>
        <ul>
            <li><span class="tile">${icon('columns')}</span><span><b>عرض أكبر للجداول</b><span>تعود مساحة القائمة الجانبية (288 بكسل) إلى المحتوى، فتظهر أعمدة الجداول دون تمرير جانبي.</span></span></li>
            <li><span class="tile">${icon('grid')}</span><span><b>المجموعات قوائم منسدلة</b><span>كل مجموعة تفتح صفحاتها مع سطر يشرح كل صفحة. الأسهم وEsc تعمل من لوحة المفاتيح.</span></span></li>
            <li><span class="tile">${icon('pin')}</span><span><b>تعرف أين أنت</b><span>المجموعة الحالية بلون الغرافيت مع الخط العنابي، واسم الصفحة يظهر في طرف الشريط وفي مسار الصفحة.</span></span></li>
            <li><span class="tile">${icon('user')}</span><span><b>الحساب في الزاوية</b><span>الملف الشخصي وتسجيل الخروج انتقلا إلى قائمة الصورة الرمزية. على الهاتف تبقى القائمة الجانبية المنزلقة.</span></span></li>
        </ul>
    </section>`;

function renderPage() {
    const page = current();
    const group = groupOf(state.current);
    const crumbs = group
        ? `<div class="crumbs"><span>${group.label}</span>${icon('chevron-left')}<span>${page.label}</span></div>`
        : '';

    if (state.current === '/dashboard') {
        $('page').innerHTML = `
            <div class="page-head">
                <div><h2>مساء الخير، <em>مدير النظام</em></h2><p>14 فرعًا · 86 مستخدمًا نشطًا عبر النظام (بيانات تجريبية)</p></div>
                <button type="button" class="add-btn">${icon('plus')}فرع جديد</button>
            </div>
            <div class="stack">
                <div class="hero">
                    <div class="hero-row">
                        <div>
                            <p class="hero-label">المشتركون النشطون</p>
                            <div class="hero-num">4,812</div>
                            <p class="hero-sub">من 5,230 · 418 غير نشط</p>
                        </div>
                        ${ring(92, 104, 'rgb(196 81 90)', 'rgb(255 255 255 / 0.1)', '1.0625rem')}
                    </div>
                    <div class="spectrum"></div>
                    <p class="hero-note">وصول قائم على الأدوار · بيانات مقسّمة حسب الفرع · بلا جداول بيانات</p>
                </div>
                <div class="stats">
                    ${[
                        ['الفروع النشطة', '12', 86, 'rgb(var(--brand-500))'],
                        ['المستخدمون النشطون', '86', 94, 'rgb(var(--gray-400))'],
                        ['الطبلونات', '340', 78, '#f59e0b'],
                        ['التعرفات', '6', 100, '#10b981'],
                    ].map(([label, value, pct, color]) => `
                        <div class="stat">${ring(pct, 64, color, 'rgb(var(--gray-100))', '0.85rem')}
                            <div><div class="stat-num">${value}</div><div class="stat-label">${label}</div></div>
                        </div>`).join('')}
                </div>
                ${NOTES}
            </div>`;
    } else {
        $('page').innerHTML = `
            <div class="page-head">
                <div>${crumbs}<h2>${page.label}</h2>${page.hint ? `<p>${page.hint}</p>` : ''}</div>
                ${group ? `<button type="button" class="add-btn">${icon('plus')}إضافة</button>` : ''}
            </div>
            <div class="stack">
                <div class="table-card">
                    <div class="table-toolbar"><h3>${page.label}</h3><small>محتوى الصفحة كما هو اليوم</small></div>
                    <div class="tray">
                        ${[78, 64, 88, 56, 72].map((width) => `<div class="tray-row">
                            <span class="bar pulse" style="width:${width}%"></span>
                            <span class="bar pulse" style="width:70%"></span>
                            <span class="bar pulse" style="width:55%"></span>
                            <span class="bar pulse" style="width:40%"></span>
                        </div>`).join('')}
                    </div>
                    <p class="tray-note">في هذا النموذج يتغيّر التنقّل فقط؛ الجداول والنوافذ تبقى كما هي.</p>
                </div>
                ${NOTES}
            </div>`;
    }
}

function navigate(href) {
    state.current = href;
    state.openGroup = null;
    closeUserMenu();
    renderNav();
    renderMega();
    renderPage();
    if ($('drawer').open) {
        renderDrawer();
        setDrawer(false);
    }
    if ($('palette').open) {
        $('palette').close();
    }
    $('main-content').focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
}

/* ── Theme ────────────────────────────────────────────────── */
function isDark() {
    const chosen = document.documentElement.dataset.theme;
    return chosen ? chosen === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

function renderThemeButton() {
    const dark = isDark();
    const button = $('theme-btn');
    button.innerHTML = icon(dark ? 'sun' : 'moon');
    button.setAttribute('aria-label', dark ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الغامق');
    button.title = dark ? 'الوضع الفاتح' : 'الوضع الغامق';
}

$('theme-btn').addEventListener('click', () => {
    document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
    renderThemeButton();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderThemeButton);

/* ── Events ───────────────────────────────────────────────── */
document.addEventListener('click', (event) => {
    const link = event.target.closest('[data-href]');
    if (link) {
        event.preventDefault();
        navigate(link.dataset.href);
        return;
    }

    const trigger = event.target.closest('[data-group]');
    if (trigger) {
        state.openGroup === trigger.dataset.group ? closeGroup() : openGroup(trigger.dataset.group);
        return;
    }

    const sideGroup = event.target.closest('[data-side-group]');
    if (sideGroup) {
        const id = sideGroup.dataset.sideGroup;
        state.drawerOpen.has(id) ? state.drawerOpen.delete(id) : state.drawerOpen.add(id);
        renderDrawer();
        document.querySelector(`[data-side-group="${id}"]`).focus();
        return;
    }

    if (event.target.closest('#user-btn')) {
        toggleUserMenu();
        return;
    }
    if (event.target.closest('#drawer-btn')) {
        setDrawer(true);
        return;
    }
    if (event.target.closest('#drawer-close') || event.target === $('drawer')) {
        setDrawer(false);
        $('drawer-btn').focus();
        return;
    }
    if (event.target.closest('#search-btn')) {
        openPalette();
        return;
    }
    if (event.target === $('palette')) {
        $('palette').close();
        return;
    }

    if (!event.target.closest('#mega')) {
        closeGroup();
    }
    if (!event.target.closest('#user-menu')) {
        closeUserMenu();
    }
});

/* Once a dropdown is open, pointing at another group switches to it, like a menu bar. */
document.addEventListener('pointerover', (event) => {
    const trigger = event.target.closest('[data-group]');
    if (trigger && state.openGroup && state.openGroup !== trigger.dataset.group && event.pointerType === 'mouse') {
        openGroup(trigger.dataset.group);
        trigger.focus({ preventScroll: true });
    }
});

document.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        openPalette();
        return;
    }

    if (event.key === 'Escape') {
        if (state.openGroup) {
            closeGroup(true);
        }
        closeUserMenu(true);
        return;
    }

    const trigger = event.target.closest?.('[data-group]');
    if (trigger && event.key === 'ArrowDown') {
        event.preventDefault();
        openGroup(trigger.dataset.group, true);
        return;
    }
    if (trigger && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
        const triggers = [...document.querySelectorAll('[data-group]')];
        const step = event.key === 'ArrowLeft' ? 1 : -1;
        const next = triggers[(triggers.indexOf(trigger) + step + triggers.length) % triggers.length];
        event.preventDefault();
        if (state.openGroup) {
            openGroup(next.dataset.group);
        }
        next.focus();
        return;
    }

    const inPanel = event.target.closest?.('#mega, #user-menu');
    if (inPanel && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
        const items = [...inPanel.querySelectorAll('.mega-link, .menu-item')];
        const index = items.indexOf(event.target);
        event.preventDefault();
        if (index === 0 && event.key === 'ArrowUp' && inPanel.id === 'mega') {
            closeGroup(true);
            return;
        }
        items[(index + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
});

$('palette-q').addEventListener('input', renderPalette);
$('palette-q').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
        event.preventDefault();
        const first = $('palette-list').querySelector('[data-href]');
        if (first) {
            navigate(first.dataset.href);
        }
    }
});
$('drawer').addEventListener('close', () => $('drawer-btn').setAttribute('aria-expanded', 'false'));
$('nav-scroll').addEventListener('scroll', () => closeGroup());
window.addEventListener('resize', () => {
    closeGroup();
    closeUserMenu();
    if (matchMedia('(min-width: 1024px)').matches) {
        setDrawer(false);
    }
});
window.addEventListener('scroll', () => {
    if (state.openGroup) {
        placeUnder($('mega'), document.querySelector(`[data-group="${state.openGroup}"]`), 'start');
    }
}, { passive: true });

renderThemeButton();
renderNav();
renderPage();
</script>
</body>
</html>
