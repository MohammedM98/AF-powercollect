<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* ألوان النظام نفسها (resources/css/app.css): ثلاثيات RGB تتبدّل في الوضع الداكن */
const tok=v=>`rgb(var(--${v}) / <alpha-value>)`,scale=(n,ks)=>Object.fromEntries(ks.map(k=>[k,tok(n+'-'+k)]));
tailwind.config={darkMode:'class',theme:{extend:{
 colors:{gray:scale('gray',[50,100,200,300,400,500,600,700,800,900]),brand:scale('brand',[50,100,400,500,600]),surface:tok('surface')},
 fontFamily:{sans:['"IBM Plex Sans Arabic"','"Segoe UI"','Tahoma','Arial','sans-serif'],display:['Alexandria','"IBM Plex Sans Arabic"','Tahoma','Arial','sans-serif']},
 borderRadius:{control:'12px',row:'18px',card:'24px',panel:'28px'},
 boxShadow:{card:'0 1px 2px rgb(16 24 40/.04),0 14px 34px -18px rgb(16 24 40/.18)',lift:'0 2px 6px rgb(16 24 40/.06),0 24px 44px -20px rgb(16 24 40/.32)'}
}}};

<style>
:root{
 --brand-50:251 241 241;--brand-100:244 214 216;--brand-400:196 81 90;--brand-500:165 29 38;--brand-600:143 24 32;
 --gray-50:239 241 244;--gray-100:233 236 239;--gray-200:223 226 230;--gray-300:205 211 218;--gray-400:94 103 115;--gray-500:76 84 96;--gray-600:70 78 89;--gray-700:53 60 70;--gray-800:35 42 51;--gray-900:17 24 32;
 --surface:255 255 255;--gut:clamp(16px,2.6vw,44px);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
.dark{color-scheme:dark;
 --brand-50:42 16 19;--brand-100:58 20 24;--brand-400:196 70 78;--brand-500:184 35 44;--brand-600:240 114 122;
 --gray-50:11 13 16;--gray-100:27 31 37;--gray-200:37 42 50;--gray-300:52 58 67;--gray-400:128 137 149;--gray-500:158 166 177;--gray-600:184 190 199;--gray-700:205 210 217;--gray-800:226 229 233;--gray-900:244 245 247;
 --surface:20 23 28}
html{scrollbar-gutter:stable}
html.locked{overflow:hidden}
body{background:rgb(var(--gray-50));color:rgb(var(--gray-900));font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(42% 38% at 8% 0%,rgb(var(--brand-500)/.10),transparent 70%),radial-gradient(38% 34% at 96% 6%,rgb(var(--gray-400)/.12),transparent 70%)}
svg{flex-shrink:0}
:focus-visible{outline:2px solid rgb(var(--gray-900));outline-offset:2px;border-radius:12px}
.font-display{font-variant-numeric:tabular-nums}
input[type=text],select,textarea{border:1px solid rgb(var(--gray-200));border-radius:12px;background:rgb(var(--surface));color:rgb(var(--gray-900))}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:rgb(var(--gray-400));box-shadow:0 0 0 3px rgb(var(--gray-900)/.08)}
input[type=checkbox]{width:18px;height:18px;border-radius:6px;accent-color:rgb(var(--brand-500));cursor:pointer}

/* الهيدر الزجاجي */
#hdr{position:sticky;top:0;z-index:40;padding:12px var(--gut) 0}
.glass{position:relative;height:64px;display:flex;align-items:center;gap:14px;max-width:1720px;margin-inline:auto;padding-inline:12px 10px;border-radius:22px;
 background:rgb(var(--surface)/.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
 border:1px solid rgb(255 255 255/.7);box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 1px 2px rgb(16 24 40/.05),0 14px 34px -20px rgb(16 24 40/.35)}
.dark .glass{background:rgb(20 23 28/.66);border-color:rgb(255 255 255/.08);box-shadow:inset 0 1px 0 rgb(255 255 255/.05),0 18px 40px -20px #000}
.glass::before{content:"";position:absolute;inset-inline:22px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,transparent);opacity:.9}
.brand{display:flex;align-items:center;gap:12px;padding:5px 8px;border-radius:14px}
.brand img{height:40px;width:auto;display:block}
.brand-divider{width:1px;height:32px;background:rgb(var(--gray-200))}
.sec{display:inline-flex;align-items:center;gap:7px;height:42px;padding-inline:13px;border-radius:13px;color:rgb(var(--gray-600));font-weight:600;font-size:14.5px;white-space:nowrap;transition:color .2s,background .2s}
.sec:hover{background:rgb(var(--gray-900)/.05)}
.sec[aria-current=page]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255/.12),0 12px 24px -12px rgb(16 24 40/.7)}
.dark .sec[aria-current=page]{background:linear-gradient(135deg,#3a434e,#2a3039 60%,#20252c)}
.tb{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:rgb(var(--gray-600));transition:background .2s,color .2s}
.tb:hover{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;font:700 14px Alexandria,sans-serif;flex:none}
@media (max-width:767px){.brand-divider,.brand-text,.sec .lbl{display:none}.glass{height:58px;border-radius:18px}}

/* أزرار النظام */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:0 10px 20px -12px rgb(16 24 40/.7)}
.dark .btn-primary{background:linear-gradient(135deg,#4a5561,#323a44 60%,#262c33);box-shadow:0 0 0 1px rgb(255 255 255/.1)}
.btn-brand{background:linear-gradient(180deg,#b8232c,#7d121b);color:#fff;box-shadow:0 10px 24px -12px rgb(165 29 38/.9)}
.btn-secondary{border:1px solid rgb(var(--gray-200));background:rgb(var(--surface));color:rgb(var(--gray-700))}
.btn-secondary:hover{border-color:rgb(var(--gray-300));background:rgb(var(--gray-50))}
.btn-danger{border:1px solid rgb(var(--brand-500)/.3);background:rgb(var(--brand-500)/.08);color:rgb(var(--brand-600))}

/* شرائح مقطّعة (SegmentedTabs) */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:14px;background:rgb(var(--gray-100));max-width:100%}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:11px;font-size:13.5px;font-weight:600;color:rgb(var(--gray-600));white-space:nowrap}
.seg button[aria-pressed=true]{background:rgb(var(--surface));color:rgb(var(--gray-900));box-shadow:0 1px 2px rgb(16 24 40/.08),0 6px 14px -8px rgb(16 24 40/.3)}

/* صفوف الصناديق: نفس شبكة صفحة الصناديق المالية */
.list{container-type:inline-size}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'pick number number' 'pick person status' 'pick amount amount' 'pick meta meta' 'pick actions actions';align-items:center;gap:10px 14px;padding:14px;border:1px solid rgb(var(--gray-100));border-radius:18px;background:rgb(var(--surface));cursor:pointer;transition:border-color .18s,box-shadow .18s,background .18s}
.row:hover,.row:focus-within{border-color:rgb(var(--gray-300));box-shadow:0 1px 2px rgb(16 24 40/.04),0 14px 34px -18px rgb(16 24 40/.18)}
.row[data-picked=true]{border-color:rgb(var(--brand-500)/.45);background:linear-gradient(180deg,rgb(var(--brand-500)/.05),rgb(var(--surface)) 60%)}
.row>*{min-width:0}
.c-pick{grid-area:pick;align-self:start;padding-top:10px}
.c-number{grid-area:number}.c-person{grid-area:person;display:flex;align-items:center;gap:8px}.c-entries{display:none}
.c-amount{grid-area:amount}.c-meta{grid-area:meta}.c-status{grid-area:status;justify-self:end}
.c-actions{grid-area:actions;display:flex;justify-content:flex-end;gap:8px}
.c-actions .btn:first-child{flex:1}
.head{display:none}
@container (min-width:900px){
 .row,.head{grid-template-columns:28px minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,.6fr) minmax(0,1fr) minmax(0,1.15fr) 150px 132px;grid-template-areas:none;gap:12px}
 .row>*{grid-area:auto!important}
 .c-pick{padding-top:0;align-self:center}.c-entries{display:block}.c-amount{text-align:start}.c-status{justify-self:start}.c-actions .btn:first-child{flex:initial}
 .head{display:grid;padding:4px 14px 8px;color:rgb(var(--gray-600));font-size:13.5px;font-weight:600}
}

/* النافذة الواسعة للصندوق */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:40px;background:rgb(10 12 15/.55);backdrop-filter:blur(3px);animation:fade .2s ease}
.win{display:flex;flex-direction:column;width:min(1100px,100%);max-height:calc(100dvh - 80px);border-radius:28px;background:rgb(var(--surface));box-shadow:0 2px 6px rgb(16 24 40/.06),0 34px 70px -26px rgb(16 24 40/.6);overflow:hidden;animation:pop .28s var(--ease)}
.win.sm{width:min(560px,100%)}
.win::before{content:"";display:block;height:3px;flex:none;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
@media (max-width:639px){.scrim{padding:10px}.win{max-height:calc(100dvh - 20px);border-radius:22px}}

/* شريط التحديد العائم */
#bar{position:fixed;z-index:50;inset-inline:0;bottom:16px;display:flex;justify-content:center;padding-inline:16px;pointer-events:none;transition:transform .3s var(--ease),opacity .2s}
#bar[hidden]{display:flex;opacity:0;transform:translateY(24px)}
#bar>div{pointer-events:auto}
#bar[hidden]>div{pointer-events:none}
#toast{position:fixed;z-index:70;top:88px;inset-inline-start:50%;translate:50% 0;transition:opacity .25s,transform .25s}
#toast[hidden]{display:block;opacity:0;transform:translateY(-8px);pointer-events:none}
table.entries{width:100%;min-width:760px;border-collapse:separate;border-spacing:0}
table.entries th{position:sticky;top:0;z-index:1;padding:10px 14px;background:rgb(var(--gray-50));color:rgb(var(--gray-500));font-size:13.5px;font-weight:600;text-align:start}
table.entries td{padding:12px 14px;border-bottom:1px solid rgb(var(--gray-100));vertical-align:top;font-size:14px}
table.entries tr[data-flag=true] td{background:rgb(var(--brand-500)/.05)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function seeded(n){let s=n*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
function makeBoxes(){
 const now=Date.now(),H=36e5,out=[];let id=1460;
 const plan=[
  [1,'cash',0,'closed',3],[1,'bank_transfer',0,'closed',5],[1,'cash',1,'closed',7],[1,'clearing',3,'closed',9],[1,'cash',2,'closed',12],
  [1,'cash',0,'sent',26],[1,'bank_transfer',1,'reviewing',30],[1,'cash',2,'noted',52],[1,'cash',1,'approved',75],[1,'clearing',3,'approved',80],
  [2,'cash',0,'sent',4],[2,'bank_transfer',1,'sent',6],[2,'cash',1,'sent',8],[2,'clearing',2,'reviewing',28],[2,'cash',0,'approved',70],
  [3,'cash',0,'sent',2],[3,'cash',1,'sent',5],[3,'bank_transfer',0,'noted',40],[3,'cash',1,'approved',90],
 ];
 plan.forEach(([branchId,type,p,state,ago],i)=>{
  const r=seeded(i+3),count=type==='clearing'?2+Math.floor(r()*2):4+Math.floor(r()*7),closedAt=now-ago*H;
  const entries=Array.from({length:count},(_,k)=>{
   const cur=type==='cash'&&r()>.82?(r()>.5?'USD':'JOD'):'ILS';
   const amount=Math.round((cur==='ILS'?80+r()*620:20+r()*180))+(r()>.6?.5:0);
   return {id:`${id}-${k}`,sub:SUBS[Math.floor(r()*SUBS.length)],acct:String(10200+Math.floor(r()*8800)),voucher:String(48000+id*7+k),amount,cur,
    ref:type==='bank_transfer'?`${BANKS[Math.floor(r()*3)]} · TRX${Math.floor(100000+r()*899999)}`:type==='clearing'?'مقاصة مع فاتورة مورّد':'',at:closedAt-(count-k)*H*(2+r()*6),flag:false};
  });
  const box={id,number:String(id),branchId,type,person:PEOPLE[branchId][Math.min(p,PEOPLE[branchId].length-1)],entries,openedAt:entries[0].at-H,closedAt,closedBy:'مسؤول الفرع',state,events:[{at:closedAt,by:'مسؤول الفرع',text:'أكّد الفرع إغلاق الصندوق'}]};
  if(state!=='closed'){box.sentAt=closedAt+H*(.3+r());box.sentBy=branchId===1?'محمد مصطفى':'مسؤول الفرع';box.events.push({at:box.sentAt,by:box.sentBy,text:'أُرسل إلى قسم التدقيق'})}
  if(['reviewing','noted','approved'].includes(state))box.events.push({at:box.sentAt+H*2,by:'قسم التدقيق',text:'بدأ التدقيق'});
  if(state==='noted'){box.entries[1].flag=true;box.note='الحركة الثانية: رقم السند لا يطابق الإيصال الورقي، يرجى التحقق وإرفاق صورة الإيصال.';box.events.push({at:box.sentAt+H*5,by:'قسم التدقيق',text:'أُعيد بملاحظة: '+box.note})}
  if(state==='approved')box.events.push({at:box.sentAt+H*6,by:'قسم التدقيق',text:'اعتُمد الصندوق'});
  out.push(box);id+=1;
 });
 return out;
}

function boxIdentity(b){
 const t=TYPES[b.type];
 return `<div class="flex min-w-0 items-center gap-3"><span class="relative shrink-0"><span class="flex h-10 w-10 items-center justify-center rounded-[13px] ${t.tile}">${icon(t.icon)}</span><span class="absolute -bottom-0.5 -start-0.5 h-3 w-3 rounded-full border-[2.5px] border-surface ${STATES[b.state].dot}"></span></span><span class="min-w-0"><span class="block truncate font-semibold text-gray-900">صندوق <bdi dir="ltr" class="font-display">${b.number}</bdi></span><span class="block truncate text-xs text-gray-500">${t.label}</span></span></div>`;
}
function amountCell(b){
 const t=totals([b]),others=['USD','JOD'].filter(c=>t[c]).map(c=>`<bdi dir="ltr">${money(t[c])}</bdi> ${CUR[c]}`).join(' · ');
 return `<p class="flex flex-wrap items-baseline gap-x-1.5"><b dir="ltr" class="font-display text-[1.0625rem] text-gray-900">${money(t.ILS)}</b><span class="text-[13px] text-gray-600">شيكل</span></p>${others?`<p class="font-display text-[13px] text-gray-600">و ${others}</p>`:''}`;
}
const person=(name,small)=>`<span aria-hidden="true" class="flex shrink-0 items-center justify-center bg-gray-900 font-semibold text-surface ${small?'h-7 w-7 rounded-[9px] text-[11px]':'h-8 w-8 rounded-[10px] text-xs'}">${initials(name)}</span><span class="truncate text-[15px] font-semibold text-gray-900">${esc(name)}</span>`;

function tile(iconHtml,label,list,hint,onclick){
 return `<button type="button" ${onclick?`data-act="${onclick}"`:''} class="flex min-w-0 items-center gap-3 rounded-card border border-gray-100 bg-surface p-4 text-start shadow-card transition hover:-translate-y-0.5 hover:shadow-lift">${iconHtml}<span class="min-w-0"><span class="block text-sm font-semibold text-gray-600">${label}</span><span class="mt-0.5 flex flex-wrap items-baseline gap-1.5"><span dir="ltr" class="font-display text-xl font-bold text-gray-900">${money(totals(list).ILS)}</span><span class="text-xs text-gray-500">₪</span></span><span class="block text-xs text-gray-500"><b class="font-display">${list.length}</b> ${hint}</span></span></button>`;
}
const tileIcon=(name,cls)=>`<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[13px] ${cls}">${icon(name)}</span>`;
const seg=(label,value,options,act)=>`<div class="seg" role="group" aria-label="${label}">${options.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v)===String(value)}">${l}</button>`).join('')}</div>`;
const n=x=>`<span class="font-display">${x}</span>`;

/* ═════ صفحة الفرع ═════ */
function branchPage(){

 const ready=mine.filter(b=>b.state==='closed'),waiting=mine.filter(b=>['sent','reviewing'].includes(b.state)),noted=mine.filter(b=>b.state==='noted'),done=mine.filter(b=>b.state==='approved');
 const groups={ready,sent:waiting,noted,done,all:mine};
 let shown=(groups[ui.status]||mine).filter(b=>(!ui.type||b.type===ui.type)&&(!ui.person||b.person===ui.person)&&(!ui.search||norm(b.number+' '+b.person).includes(norm(ui.search))));
 shown=[...shown].sort((a,b)=>b.closedAt-a.closedAt);
 const people=[...new Set(mine.map(b=>b.person))];
 return `
 <div class="flex flex-wrap items-end justify-between gap-4">
  <div><p class="text-sm font-semibold text-gray-500">${branchName(ui.branchId)}</p>
   <div class="mt-1 flex flex-wrap items-center gap-x-4 gap-y-2"><h2 class="text-3xl font-bold text-gray-900">الصناديق المالية</h2>
    <div class="seg" role="tablist"><button type="button" aria-pressed="false" title="صفحة الصناديق الحالية كما هي">الصناديق</button><button type="button" aria-pressed="false">الحركات المفتوحة</button><button type="button" aria-pressed="true">${icon('send','h-4 w-4')}الإرسال إلى التدقيق${ready.length?`<span class="min-w-5 rounded-full bg-brand-500 px-1.5 font-display text-[11px] leading-5 text-white">${ready.length}</span>`:''}</button></div>
   </div></div>
 </div>

 <section class="mt-5 flex items-start gap-3 rounded-card border border-sky-500/20 bg-sky-500/[.06] p-4 text-sm leading-7 text-gray-700">
  <span class="mt-0.5 text-sky-600 dark:text-sky-400">${icon('info')}</span>
  <div class="min-w-0"><b class="text-gray-900">لا حزمة أسبوعية بعد الآن.</b> كل صندوق يؤكّد الفرع إغلاقه يظهر هنا جاهزًا للإرسال. أرسله وحده، أو حدّد عدة صناديق وأرسلها معًا، وسيصل كل صندوق إلى قسم التدقيق منفردًا برقمه واسم الفرع. لا موعد قطع أسبوعي ولا انتظار لبقية الصناديق.
   <ol class="mt-3 grid gap-2 sm:grid-cols-4">${[['check','يُغلق الفرع الصندوق','كما يحدث اليوم في صفحة الصناديق'],['wallet','يظهر هنا جاهزًا','بانتظار الإرسال'],['send','يُرسَل منفردًا أو مع غيره','بزر واحد'],['shield','يدقّقه قسم التدقيق','صندوقًا صندوقًا، برقمه وفرعه']].map(([i,t,s],k)=>`<li class="flex items-center gap-2.5 rounded-control bg-surface px-3 py-2 shadow-sm"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[10px] bg-gray-900 font-display text-xs font-bold text-surface">${k+1}</span><span class="min-w-0 leading-5"><b class="block text-[13px] text-gray-900">${t}</b><small class="block text-xs text-gray-500">${s}</small></span></li>`).join('')}</ol>
  </div>
 </section>

 <section class="mt-5 grid gap-3 sm:grid-cols-2 xl:grid-cols-4" aria-label="ملخص">
  ${tile(tileIcon('wallet','bg-amber-500/10 text-amber-600 dark:text-amber-400'),'جاهزة للإرسال',ready,'صناديق مغلقة لم تُرسل','status:ready')}
  ${tile(tileIcon('clock','bg-sky-500/10 text-sky-600 dark:text-sky-400'),'بانتظار التدقيق',waiting,'صناديق أُرسلت','status:sent')}
  ${tile(tileIcon('alert','bg-brand-500/10 text-brand-600'),'ملاحظات من التدقيق',noted,'صناديق تنتظر ردّك','status:noted')}
  ${tile(tileIcon('check','bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'),'مُدقّقة',done,'صناديق اعتمدها التدقيق','status:done')}
 </section>

 <section class="mt-5 overflow-hidden rounded-panel border border-gray-100 bg-surface shadow-card" aria-label="الصناديق">
  <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6">
   <div class="flex w-full flex-wrap items-center gap-3 sm:w-auto">
    <label class="relative block w-full sm:w-72"><span class="pointer-events-none absolute inset-y-0 start-3.5 my-auto h-[18px] text-gray-400">${icon('search','h-[18px] w-[18px]')}</span><input type="text" data-in="search" value="${esc(ui.search)}" placeholder="ابحث برقم الصندوق أو اسم الموظف" class="block w-full py-2.5 pe-4 ps-10 text-sm"></label>
    <select data-in="person" class="w-full py-2.5 text-sm sm:w-48"><option value="">كل الموظفين</option>${people.map(p=>`<option ${p===ui.person?'selected':''}>${esc(p)}</option>`).join('')}</select>
   </div>
   <div class="flex max-w-full flex-wrap items-center gap-2">
    ${seg('النوع',ui.type,[['','كل الأنواع'],...Object.entries(TYPES).map(([k,t])=>[k,t.label])],'type')}
    ${seg('الحالة',ui.status,[['ready',`جاهزة للإرسال · ${n(ready.length)}`],['sent',`بانتظار التدقيق · ${n(waiting.length)}`],['noted',`عليها ملاحظات · ${n(noted.length)}`],['done',`مُدقّقة · ${n(done.length)}`],['all',`الكل · ${n(mine.length)}`]],'status')}

  <p class="flex flex-wrap items-baseline justify-between gap-2 border-t border-gray-100 px-4 py-3.5 text-sm text-gray-600 sm:px-6"><span>المعروض <b class="font-display text-gray-900">${shown.length}</b> من <b class="font-display text-gray-900">${mine.length}</b> صندوقًا</span><span>المجموع: <b class="font-display text-gray-900">${amountsLine(totals(shown))}</b></span></p>
 </section>`;
}

/* ═════ صفحة قسم التدقيق ═════ */
function auditPage(){
 const incoming=boxes.filter(b=>b.state!=='closed');
 const inBranch=incoming.filter(b=>!ui.auditBranch||b.branchId===ui.auditBranch);
 const by=s=>inBranch.filter(b=>b.state===s);
 const groups={new:by('sent'),reviewing:by('reviewing'),noted:by('noted'),approved:by('approved'),all:inBranch};
 let shown=groups[ui.auditStatus].filter(b=>(!ui.type||b.type===ui.type)&&(!ui.search||norm(b.number+' '+b.person+' '+branchName(b.branchId)).includes(norm(ui.search))));
 shown=[...shown].sort((a,b)=>a.sentAt-b.sentAt);
 const chip=(id,label)=>{const all=incoming.filter(b=>!id||b.branchId===id),fresh=all.filter(b=>b.state==='sent').length;return `<button type="button" data-act="abranch" data-v="${id}" aria-pressed="${ui.auditBranch===id}" class="inline-flex items-center gap-2 rounded-full border px-3.5 py-2 text-sm font-semibold transition ${ui.auditBranch===id?'border-transparent bg-gray-900 text-surface shadow-lift':'border-gray-200 bg-surface text-gray-700 hover:border-gray-300'}">${id?icon('building','h-4 w-4'):''}${label} <span class="font-display opacity-70">${all.length}</span>${fresh?`<span class="rounded-full bg-brand-500 px-1.5 font-display text-[11px] leading-5 text-white" title="وارد جديد">${fresh}</span>`:''}</button>`};
 return `
 <div class="flex flex-wrap items-end justify-between gap-4">
  <div><p class="text-sm font-semibold text-gray-500">قسم التدقيق المالي</p>
   <h2 class="mt-1 text-3xl font-bold text-gray-900">صناديق الفروع</h2>
   <p class="mt-1 text-sm text-gray-500">كل صندوق يصل منفردًا من الفرع الذي أرسله. ابدأ بالأقدم وصولًا.</p></div>
 </div>
 <div class="mt-5 flex flex-wrap gap-2" aria-label="الفرع المرسل">${chip(0,'كل الفروع')}${BRANCHES.map(b=>chip(b.id,b.name)).join('')}</div>
 <section class="mt-5 grid gap-3 sm:grid-cols-2 xl:grid-cols-4" aria-label="ملخص">
  ${tile(tileIcon('send','bg-sky-500/10 text-sky-600 dark:text-sky-400'),'وارد جديد',groups.new,'صناديق لم يبدأ تدقيقها','astatus:new')}
  ${tile(tileIcon('eye','bg-violet-500/10 text-violet-600 dark:text-violet-400'),'قيد التدقيق',groups.reviewing,'صناديق مفتوحة للتدقيق','astatus:reviewing')}
  ${tile(tileIcon('alert','bg-brand-500/10 text-brand-600'),'أُعيدت بملاحظات',groups.noted,'بانتظار رد الفرع','astatus:noted')}
  ${tile(tileIcon('check','bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'),'مُدقّقة',groups.approved,'صناديق معتمدة','astatus:approved')}
 </section>
 <section class="mt-5 overflow-hidden rounded-panel border border-gray-100 bg-surface shadow-card">
  <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6">
   <label class="relative block w-full sm:w-80"><span class="pointer-events-none absolute inset-y-0 start-3.5 my-auto h-[18px] text-gray-400">${icon('search','h-[18px] w-[18px]')}</span><input type="text" data-in="search" value="${esc(ui.search)}" placeholder="رقم الصندوق، الموظف أو الفرع" class="block w-full py-2.5 pe-4 ps-10 text-sm"></label>
   <div class="flex max-w-full flex-wrap items-center gap-2">
    ${seg('النوع',ui.type,[['','كل الأنواع'],...Object.entries(TYPES).map(([k,t])=>[k,t.label])],'type')}
    ${seg('الحالة',ui.auditStatus,[['new',`وارد جديد · ${n(groups.new.length)}`],['reviewing',`قيد التدقيق · ${n(groups.reviewing.length)}`],['noted',`بملاحظات · ${n(groups.noted.length)}`],['approved',`مُدقّقة · ${n(groups.approved.length)}`],['all',`الكل · ${n(inBranch.length)}`]],'astatus')}
   </div>
  </div>
  <div class="list bg-gray-50 p-3 sm:p-4">${rowsHtml(shown,'audit')}</div>
  <p class="flex flex-wrap items-baseline justify-between gap-2 border-t border-gray-100 px-4 py-3.5 text-sm text-gray-600 sm:px-6"><span>المعروض <b class="font-display text-gray-900">${shown.length}</b> صندوقًا</span><span>المجموع: <b class="font-display text-gray-900">${amountsLine(totals(shown))}</b></span></p>
 </section>`;
}

/* صفوف الصناديق للصفحتين */
function rowsHtml(list,role){
 if(!list.length)return `<div class="flex flex-col items-center gap-2 px-4 py-14 text-center text-gray-500"><span class="text-gray-400">${icon('wallet','h-8 w-8')}</span><p>${role==='branch'&&ui.status==='ready'?'لا صناديق مغلقة تنتظر الإرسال. كل ما أُغلق أُرسل.':'لا صناديق بهذه الفلاتر.'}</p></div>`;
 const pickable=role==='branch'&&list.some(b=>b.state==='closed');
 const allPicked=pickable&&list.filter(b=>b.state==='closed').every(b=>ui.picked.has(b.id));
 const head=`<div class="head"><span>${pickable?`<input type="checkbox" data-act="pickall" aria-label="تحديد كل الجاهزة" ${allPicked?'checked':''}>`:''}</span><span>الصندوق</span><span>${role==='audit'?'الفرع · الموظف':'الموظف'}</span><span>الحركات</span><span>الإجمالي</span><span>${role==='audit'?'وصل في':'أُغلق في'}</span><span>الحالة</span><span></span></div>`;
 return head+`<div class="rows">${list.map(b=>{
  const [tone,label]=STATES[b.state][role]||STATES[b.state].branch;
  const canPick=role==='branch'&&b.state==='closed',picked=ui.picked.has(b.id);
  const btn=role==='branch'
   ?(b.state==='closed'?`<button type="button" class="btn btn-primary px-3 py-1.5" data-act="sendone" data-id="${b.id}">${icon('send','h-4 w-4')}إرسال</button>`:b.state==='noted'?`<button type="button" class="btn btn-danger px-3 py-1.5" data-act="open" data-id="${b.id}">${icon('chat','h-4 w-4')}الرد</button>`:`<button type="button" class="btn btn-secondary px-3 py-1.5" data-act="open" data-id="${b.id}">عرض الصندوق</button>`)
   :(['sent','reviewing'].includes(b.state)?`<button type="button" class="btn btn-primary px-3 py-1.5" data-act="open" data-id="${b.id}">${icon('eye','h-4 w-4')}تدقيق</button>`:`<button type="button" class="btn btn-secondary px-3 py-1.5" data-act="open" data-id="${b.id}">عرض</button>`);
  return `<div class="row" data-act="open" data-id="${b.id}" data-picked="${picked}" tabindex="-1">
   <div class="c-pick">${canPick?`<input type="checkbox" data-act="pick" data-id="${b.id}" ${picked?'checked':''} aria-label="تحديد الصندوق ${b.number}">`:'<span class="block w-[18px]"></span>'}</div>
   <div class="c-number">${boxIdentity(b)}</div>
   <div class="c-person">${role==='audit'?`<span class="min-w-0"><span class="flex items-center gap-1.5 text-[15px] font-semibold text-gray-900">${icon('building','h-4 w-4 text-gray-500')}${branchName(b.branchId)}</span><span class="block truncate text-xs text-gray-500">${esc(b.person)}</span></span>`:person(b.person)}</div>
   <div class="c-entries"><b class="font-display text-gray-900">${b.entries.length}</b> <span class="text-[13px] text-gray-600">حركة</span>${b.entries.some(e=>e.flag)?`<span class="block text-xs font-semibold text-brand-600">${b.entries.filter(e=>e.flag).length} عليها ملاحظة</span>`:''}</div>
   <div class="c-amount">${amountCell(b)}</div>
   <div class="c-meta text-sm text-gray-700"><span class="inline-flex items-center gap-1.5">${icon('clock','h-3.5 w-3.5 text-gray-500')}${role==='audit'?fmt(b.sentAt):fmt(b.closedAt)}</span><span class="block text-xs text-gray-500">${role==='audit'?`أرسله ${esc(b.sentBy)}`:b.sentAt?`أُرسل ${fmt(b.sentAt)}`:'لم يُرسل بعد'}</span></div>
   <div class="c-status">${pill(tone,label)}</div>
   <div class="c-actions">${btn}</div>
  </div>`}).join('')}</div>`;
}

/* ═════ النوافذ ═════ */

function boxModal(b){

 const auditing=role==='audit'&&b.state==='reviewing';
 const stat=(k,v)=>`<div class="min-w-0 rounded-control bg-gray-50 px-3 py-2.5"><dt class="text-xs font-semibold text-gray-500">${k}</dt><dd class="mt-0.5 truncate text-sm font-semibold text-gray-900">${v}</dd></div>`;
 let footer='';
 if(auditing)footer=`<div id="returnBox" hidden class="w-full"><label class="block"><span class="mb-1.5 block text-sm font-semibold text-gray-700">ملاحظة التدقيق للفرع</span><textarea id="auditNote" rows="2" class="block w-full p-3 text-sm" placeholder="ما الذي يجب أن يصححه الفرع؟"></textarea></label></div>
  <button type="button" class="btn btn-danger" data-act="return" data-id="${b.id}">${icon('undo','h-4 w-4')}إرجاع بملاحظة</button><button type="button" class="btn btn-primary" data-act="approve" data-id="${b.id}">${icon('check','h-4 w-4')}اعتماد الصندوق</button>`;
 else if(role==='branch'&&b.state==='noted')footer=`<label class="block w-full"><span class="mb-1.5 block text-sm font-semibold text-gray-700">رد الفرع</span><textarea id="replyNote" rows="2" class="block w-full p-3 text-sm" placeholder="ما الذي صححته؟"></textarea></label><button type="button" class="btn btn-brand" data-act="reply" data-id="${b.id}">${icon('send','h-4 w-4')}إرسال الرد وإعادة الصندوق للتدقيق</button>`;
 else if(role==='branch'&&b.state==='closed')footer=`<button type="button" class="btn btn-brand" data-act="sendone" data-id="${b.id}">${icon('send','h-4 w-4')}إرسال إلى التدقيق</button>`;
 return `<div class="win" role="dialog" aria-modal="true" aria-labelledby="mt">
  <header class="flex flex-wrap items-start justify-between gap-3 border-b border-gray-100 px-6 py-4">
   <div class="flex min-w-0 items-center gap-3"><span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-[14px] ${t.tile}">${icon(t.icon,'h-6 w-6')}</span><div class="min-w-0"><h3 id="mt" class="text-xl font-bold text-gray-900">صندوق <bdi dir="ltr" class="font-display">${b.number}</bdi></h3><p class="mt-0.5 flex flex-wrap items-center gap-2 text-sm text-gray-500"><span class="inline-flex items-center gap-1">${icon('building','h-4 w-4')}${branchName(b.branchId)}</span>·<span>${t.full}</span>·${pill(tone,label)}</p></div></div>
   <button type="button" class="tb" data-act="close" aria-label="إغلاق">${icon('close')}</button>
  </header>
  <div class="min-h-0 flex-1 overflow-y-auto">
   <dl class="grid grid-cols-2 gap-2 p-5 sm:grid-cols-3 lg:grid-cols-6">
    ${stat('الموظف',esc(b.person))}${stat('الحركات',n(b.entries.length))}${stat('الإجمالي',`<span class="font-display" dir="ltr">${money(tt.ILS)}</span> شيكل`)}
    ${stat('أُغلق',fmt(b.closedAt))}${stat('أُرسل',b.sentAt?fmt(b.sentAt):'لم يُرسل')}${stat('أرسله',esc(b.sentBy||'—'))}
   </dl>
   ${b.note&&b.state==='noted'?`<div class="mx-5 mb-4 flex gap-2 rounded-control border border-brand-500/25 bg-brand-500/[.07] p-3 text-sm leading-6 text-gray-800">${icon('alert','h-5 w-5 shrink-0 text-brand-600')}<span><b class="text-brand-600">ملاحظة التدقيق:</b> ${esc(b.note)}</span></div>`:''}
   ${b.sendNote?`<div class="mx-5 mb-4 flex gap-2 rounded-control bg-gray-50 p-3 text-sm leading-6 text-gray-700">${icon('note','h-5 w-5 shrink-0 text-gray-500')}<span><b>ملاحظة الفرع عند الإرسال:</b> ${esc(b.sendNote)}</span></div>`:''}
   <div class="overflow-x-auto border-y border-gray-100"><table class="entries"><thead><tr><th>المشترك</th><th>رقم الحساب</th><th>السند</th><th>${b.type==='cash'?'وقت القبض':'المرجع'}</th><th>المبلغ</th>${auditing?'<th></th>':''}</tr></thead><tbody>
    ${b.entries.map(e=>`<tr data-flag="${e.flag}"><td class="font-semibold text-gray-900">${esc(e.sub)}${e.flag?`<span class="ms-2">${pill('red','ملاحظة')}</span>`:''}</td><td class="font-display text-gray-700">${e.acct}</td><td class="font-display text-gray-700">${e.voucher}</td><td class="text-gray-600">${b.type==='cash'?fmt(e.at):esc(e.ref)}</td><td class="whitespace-nowrap"><b dir="ltr" class="font-display text-gray-900">${money(e.amount)}</b> <small class="text-gray-500">${CUR[e.cur]}</small></td>${auditing?`<td class="text-end"><button type="button" class="btn ${e.flag?'btn-danger':'btn-secondary'} px-2.5 py-1 text-xs" data-act="flag" data-id="${b.id}" data-e="${e.id}">${icon('note','h-3.5 w-3.5')}${e.flag?'إلغاء الملاحظة':'ملاحظة'}</button></td>`:''}</tr>`).join('')}
   </tbody></table></div>
   <div class="p-5"><h4 class="mb-3 flex items-center gap-2 text-sm font-bold text-gray-900">${icon('history','h-4 w-4')}سجل الصندوق</h4>
    <ol class="space-y-2 border-s-2 border-gray-100 ps-4">${[...b.events].reverse().map(ev=>`<li class="relative text-sm"><span class="absolute -start-[21px] top-1.5 h-2.5 w-2.5 rounded-full bg-gray-300 ring-4 ring-surface"></span><b class="text-gray-900">${esc(ev.text)}</b><small class="block text-xs text-gray-500">${esc(ev.by)} · ${fmt(ev.at)}</small></li>`).join('')}</ol></div>
  </div>
  ${footer?`<footer class="flex flex-wrap items-end justify-end gap-2 border-t border-gray-100 px-6 py-4">${footer}</footer>`:''}
 </div>`;
}

/* ═════ الرسم ═════ */
function render(){
 const keep=document.activeElement?.dataset?.in,pos=keep?document.activeElement.selectionStart:null;
 $('#whoBranch').textContent=ui.role==='branch'?branchName(ui.branchId):'قسم التدقيق المالي';
 $('#avatar').textContent=ui.role==='branch'?'م م':'ت م';
 $('#secs').innerHTML=(ui.role==='branch'?[['wallet','الصناديق المالية',true],['users','المشتركون'],['chat','الرسائل']]:[['shield','صناديق الفروع',true],['list','سجل التدقيق']]).map(([i,l,on])=>`<a href="#" class="sec" ${on?'aria-current="page"':''}>${icon(i,'h-[18px] w-[18px]')}<span class="lbl">${l}</span></a>`).join('');
 $('#role').innerHTML=[['branch','الفرع'],['audit','قسم التدقيق']].map(([v,l])=>`<button type="button" data-act="role" data-v="${v}" aria-pressed="${ui.role===v}">${icon(v==='branch'?'building':'shield','h-4 w-4')}${l}</button>`).join('');
 $('#page').innerHTML=ui.role==='branch'?branchPage():auditPage();
 renderBar();
 const box=ui.open&&boxes.find(b=>b.id===ui.open);
 $('#layer').innerHTML=ui.modal?`<div class="scrim" data-act="scrim">${ui.modal.kind==='send'?sendModal(ui.modal.ids):box?boxModal(box):''}</div>`:'';
 document.documentElement.classList.toggle('locked',!!ui.modal);
 if(keep){const el=document.querySelector(`#page [data-in="${keep}"]`);if(el){el.focus();if(pos!=null)el.setSelectionRange(pos,pos)}}
}
function toast(text){const t=$('#toast');t.innerHTML=`<div class="flex items-center gap-2 rounded-full bg-gray-900 px-4 py-2.5 text-sm font-semibold text-surface shadow-lift">${icon('check','h-4 w-4 text-emerald-400 dark:text-emerald-600')}${text}</div>`;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const log=(b,by,text)=>b.events.push({at:Date.now(),by,text});

document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,id=Number(el.dataset.id),b=boxes.find(x=>x.id===id);
 if(act==='scrim'&&ev.target!==el)return;
 if(act==='pick'||act==='pickall'){ev.stopPropagation()}
 switch(act){
  case 'role':ui.role=el.dataset.v;store.set(KEY+':role',ui.role);ui.search='';ui.type='';ui.picked.clear();break;
  case 'status':ui.status=el.dataset.v;break;
  case 'astatus':ui.auditStatus=el.dataset.v;break;
  case 'abranch':ui.auditBranch=Number(el.dataset.v);break;
  case 'type':ui.type=el.dataset.v;break;
  case 'pick':ui.picked.has(id)?ui.picked.delete(id):ui.picked.add(id);break;
  case 'pickall':{const ready=boxes.filter(x=>x.branchId===ui.branchId&&x.state==='closed'&&(!ui.type||x.type===ui.type));const all=ready.every(x=>ui.picked.has(x.id));ready.forEach(x=>all?ui.picked.delete(x.id):ui.picked.add(x.id));break}
  case 'clear':ui.picked.clear();break;
  case 'sendone':ui.modal={kind:'send',ids:[id]};break;
  case 'sendpicked':ui.modal={kind:'send',ids:[...ui.picked]};break;
  case 'confirmsend':{const ids=el.dataset.ids.split(',').map(Number),note=$('#sendNote')?.value.trim();ids.forEach(i=>{const x=boxes.find(y=>y.id===i);x.state='sent';x.sentAt=Date.now();x.sentBy='محمد مصطفى';if(note)x.sendNote=note;log(x,x.sentBy,'أُرسل إلى قسم التدقيق');ui.picked.delete(i)});save();ui.modal=null;ui.open=null;toast(ids.length===1?`أُرسل الصندوق ${ids[0]} إلى التدقيق`:`أُرسلت ${ids.length} صناديق إلى التدقيق، كلٌّ برقمه`);break}
  case 'open':if(ev.target.closest('input'))return;ui.open=id;ui.modal={kind:'box'};if(ui.role==='audit'&&b.state==='sent'){b.state='reviewing';log(b,'قسم التدقيق','بدأ التدقيق');save()}break;
  case 'flag':{const e=b.entries.find(x=>x.id===el.dataset.e);e.flag=!e.flag;save();break}
  case 'approve':b.state='approved';b.entries.forEach(e=>e.flag=false);log(b,'قسم التدقيق','اعتُمد الصندوق');save();ui.modal=null;toast(`اعتُمد الصندوق ${b.number} · ${branchName(b.branchId)}`);break;
  case 'return':{const box=$('#returnBox');if(box.hidden){box.hidden=false;$('#auditNote').focus();return}const note=$('#auditNote').value.trim()||'يرجى مراجعة الحركات المؤشَّر عليها.';b.state='noted';b.note=note;log(b,'قسم التدقيق','أُعيد بملاحظة: '+note);save();ui.modal=null;toast(`أُعيد الصندوق ${b.number} إلى ${branchName(b.branchId)}`);break}
  case 'reply':{const r=$('#replyNote').value.trim()||'تم التصحيح.';b.state='sent';b.entries.forEach(e=>e.flag=false);log(b,'محمد مصطفى','رد الفرع: '+r);save();ui.modal=null;toast(`أُعيد الصندوق ${b.number} إلى التدقيق مع الرد`);break}
  case 'close':case 'scrim':ui.modal=null;ui.open=null;break;
  default:if(act.includes(':')){const[k,v]=act.split(':');ui[k==='status'?'status':'auditStatus']=v;break}return;
 }
 render();
});
document.addEventListener('input',ev=>{const k=ev.target.dataset.in;if(!k)return;ui[k]=ev.target.value;render()});
document.addEventListener('change',ev=>{if(ev.target.dataset.in==='person'){ui.person=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal){ui.modal=null;ui.open=null;render()}});

$('#logo').src=LOGO;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=icon(e.dataset.i,'h-4 w-4'));
const themeBtn=$('#theme'),paintTheme=()=>themeBtn.innerHTML=icon(document.documentElement.classList.contains('dark')?'sun':'moon');
themeBtn.onclick=()=>{const d=!document.documentElement.classList.contains('dark');document.documentElement.classList.toggle('dark',d);store.set('af-tw-mode',d?'dark':'light');paintTheme()};
paintTheme();
render();
</script>
</body>
</html>
